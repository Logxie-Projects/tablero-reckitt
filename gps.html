<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GPS · LogxView</title>
<!-- gps.html · GPS de un vehículo con pantalla de carga (11-nov-2026)
     Pedido del usuario: al abrir el GPS "se ve una ventana blanca cargando por cierto tiempo... ¿es posible mostrar algo mientras
     se carga?". La página de Satrack no es nuestra y no se puede cambiar; esta página la muestra ADENTRO (iframe) y, mientras
     carga, deja a la vista de qué vehículo es y dónde lo ubicó el GPS. Siempre queda el botón "Abrir en Satrack" por si adentro no
     carga. Solo abre enlaces l.satrack.com: recibe el CÓDIGO del enlace, no una dirección, así que no sirve para abrir otra cosa.
     Los datos llegan después del # (no viajan al servidor): e = código del enlace, p = placa, d = dónde está (texto del tablero),
     la / lo = último punto leído, f = su hora.
     11-nov ("usa el modo satélite"): el mapa de Satrack no deja elegir la vista desde afuera, así que la página abre primero una
     vista de SATÉLITE propia (Google Maps) con el último punto que leyó el sistema (cada 10 minutos) y un botón para pasar al mapa
     en vivo de Satrack y volver. Sin punto, abre Satrack directo.
     No lleva datos de viajes ni claves. La abre lean.js (gpsDeViaje). -->
<style>
  :root{--marca:#ff007f;--texto:#1b1f27;--gris:#667085;--borde:#e5e7eb;--fondo:#f5f6f8}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:var(--fondo)}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--borde);flex-wrap:wrap}
  header .marca{font-weight:800;color:var(--marca)}
  header .placa{font-weight:800;font-size:17px;border:1px solid var(--borde);border-radius:7px;padding:2px 9px}
  header .donde{color:var(--gris);font-size:14px;flex:1;min-width:140px}
  header a,header button{font-size:13px;font-weight:700;color:var(--texto);text-decoration:none;border:1px solid var(--borde);border-radius:8px;padding:7px 12px;background:#fff}
  header a:hover,header button:hover{border-color:var(--marca);color:var(--marca)}
  header button{cursor:pointer;font-family:inherit}
  header button.on{background:var(--marca);border-color:var(--marca);color:#fff}
  main{position:relative;flex:1;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #carga{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--fondo);text-align:center;padding:24px;transition:opacity .35s}
  #carga.fuera{opacity:0;pointer-events:none}
  .via{position:relative;width:240px;height:46px;overflow:hidden}
  .via:after{content:'';position:absolute;left:0;right:0;bottom:6px;height:2px;background:repeating-linear-gradient(90deg,var(--borde) 0 14px,transparent 14px 26px);animation:via 0.7s linear infinite}
  .camion{position:absolute;left:94px;bottom:8px;width:52px;height:22px;animation:bote 0.5s ease-in-out infinite alternate}
  .camion i{position:absolute;display:block}
  .camion .carga{left:1px;top:3px;width:31px;height:12px;background:var(--marca);border-radius:1px}
  .camion .chasis{left:1px;top:15px;width:50px;height:2px;background:var(--texto)}
  .camion .cabina{left:37px;top:5px;width:14px;height:11px;background:var(--texto);border-radius:2px 6px 1px 1px}
  .camion .ll{top:16px;width:5px;height:5px;border-radius:50%;background:var(--texto)}
  @keyframes via{to{transform:translateX(-26px)}}
  @keyframes bote{to{transform:translateY(-1.5px)}}
  #carga h1{font-size:20px;margin:0}
  #carga p{margin:0;color:var(--gris);font-size:14px;max-width:420px;line-height:1.5}
  #carga .tarda{display:none}
  #carga.lento .tarda{display:block}
  @media (prefers-reduced-motion:reduce){.via:after,.camion{animation:none}}
</style>
</head>
<body>
<header>
  <span class="marca">LogxView</span>
  <span class="placa" id="placa" hidden></span>
  <span class="donde" id="donde"></span>
  <button type="button" id="bSat" hidden>Satélite</button>
  <button type="button" id="bVivo" hidden>En vivo (Satrack)</button>
  <a id="abrir" target="_blank" rel="noopener" hidden>Abrir en Satrack ↗</a>
</header>
<main>
  <iframe id="mapa" title="Mapa del GPS" referrerpolicy="no-referrer" hidden></iframe>
  <div id="carga">
    <div class="via"><div class="camion"><i class="carga"></i><i class="chasis"></i><i class="cabina"></i><i class="ll" style="left:3px"></i><i class="ll" style="left:9px"></i><i class="ll" style="left:27px"></i><i class="ll" style="left:44px"></i></div></div>
    <h1 id="titulo">Cargando el GPS…</h1>
    <p id="detalle"></p>
    <p class="tarda">Está tardando más de lo normal. Puede abrirlo directamente con el botón <b>Abrir en Satrack</b>, arriba a la derecha.</p>
  </div>
</main>
<script>
(function () {
  var P = new URLSearchParams(location.hash.replace(/^#/, ''));
  var codigo = (P.get('e') || '').trim(), placa = (P.get('p') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8), donde = (P.get('d') || '').slice(0, 120);
  var $ = function (id) { return document.getElementById(id); }, carga = $('carga');
  if (placa) { $('placa').textContent = placa; $('placa').hidden = false; document.title = 'GPS · ' + placa + ' · LogxView'; $('titulo').textContent = 'Cargando el GPS de ' + placa + '…'; }
  $('donde').textContent = donde;
  $('detalle').textContent = donde ? 'Último dato en el tablero: ' + donde + '.' : '';
  // solo códigos de enlaces de Satrack y coordenadas de Colombia: nada más se abre desde aquí
  var la = Number(P.get('la')), lo = Number(P.get('lo')), hayPunto = !!P.get('la') && !!P.get('lo') && la > -5 && la < 14 && lo > -82 && lo < -66;
  var hayCodigo = /^[A-Za-z0-9]{3,12}$/.test(codigo);
  if (!hayCodigo && !hayPunto) { $('titulo').textContent = 'Este enlace del GPS no es válido'; $('detalle').textContent = 'Ábralo de nuevo desde el tablero.'; document.querySelector('.via').style.display = 'none'; return; }
  var satrack = hayCodigo ? 'https://l.satrack.com/' + codigo : '', satelite = hayPunto ? 'https://www.google.com/maps/embed?origin=mfe&pb=!1m4!2m1!1s' + la.toFixed(6) + ',' + lo.toFixed(6) + '!5e1!6i21'   /* 5e1 = satélite, 6i21 = acercamiento, el máximo (escala de Google: 1 = el mundo, 21 = lo más cerca). Fue 17, luego 19; el usuario pidió más cerca ("el de Reckitt se ve muy lejos") */ : '';
  var hora = ''; try { var fe = new Date(P.get('f') || ''); if (!isNaN(fe)) hora = fe.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }); } catch (x) {}
  var f = $('mapa'), t0 = 0, lento = 0;
  if (hayCodigo) { $('abrir').href = satrack; $('abrir').hidden = false; }
  else { $('abrir').href = 'https://www.google.com/maps?q=' + la.toFixed(6) + ',' + lo.toFixed(6) + '&t=k'; $('abrir').textContent = 'Abrir en Google Maps ↗'; $('abrir').hidden = false; }
  f.addEventListener('load', function () { setTimeout(function () { carga.classList.add('fuera'); }, Math.max(0, 1200 - (Date.now() - t0))); });
  function ver(que) {
    var sat = que === 'sat';
    $('bSat').classList.toggle('on', sat); $('bVivo').classList.toggle('on', !sat);
    carga.classList.remove('fuera', 'lento'); t0 = Date.now(); clearTimeout(lento);
    $('titulo').textContent = (sat ? 'Cargando la vista de satélite' : 'Cargando el GPS en vivo') + (placa ? ' de ' + placa : '') + '…';
    $('detalle').textContent = sat ? 'Último punto que leyó el sistema' + (hora ? ' (' + hora + ')' : '') + '. El sistema lee el GPS cada 10 minutos; para verlo moverse use "En vivo (Satrack)".' : (donde ? 'Último dato en el tablero: ' + donde + '.' : '');
    f.hidden = false; f.src = sat ? satelite : satrack;
    lento = setTimeout(function () { carga.classList.add('lento'); }, 12000);
  }
  if (hayPunto && hayCodigo) { $('bSat').hidden = false; $('bVivo').hidden = false; $('bSat').onclick = function () { ver('sat'); }; $('bVivo').onclick = function () { ver('vivo'); }; }
  ver(hayPunto ? 'sat' : 'vivo');
})();
</script>
</body>
</html>
