<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Despacho Conductores</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f1f3f6; --line:#e3e6eb; --text:#1b1f27; --muted:#667085;
  --accent:#ff007f; --accent-soft:#ffe9f3; --ok:#16a34a; --ok-soft:#dcfce7; --warn:#c2410c; --warn-soft:#ffedd5; --bad:#dc2626; --bad-soft:#fee2e2;
  --wa:#25d366;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:3}
header h1{font-size:17px;margin:0}
header h1 b{color:var(--accent)}
header .hora{color:var(--muted);font-size:12px}
header .der{margin-left:auto;display:flex;gap:8px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b:hover{background:var(--surface-2)}
.b-pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b-pri:hover{background:#e6006f}
.b-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.b-wa:hover{background:#1ebe5b}
.b-mini{padding:4px 9px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .num{background:var(--surface-2);border-radius:99px;padding:0 7px;margin-left:4px;font-size:12px}
.alerta{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.alerta h3{margin:0 0 6px;font-size:14px;color:var(--bad)}
.alerta .it{display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;gap:8px;align-items:flex-start}
.op{font-size:11px;font-weight:800;border-radius:5px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.op.IMPO{background:#e0ecff;color:#1d4ed8}
.card .bk{font-weight:800;font-size:15px}
.card .sub{color:var(--muted);font-size:13px}
.placa{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.barra{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok)}
.estado{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.estado b{color:var(--ok)}
.tarde{color:var(--warn);font-weight:700}
.nov{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 8px;font-size:13px}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);background:var(--surface-2);font-weight:700}
.tabla{overflow-x:auto}
.vacio{color:var(--muted);text-align:center;padding:40px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:240px}
/* ventanas */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.ven{background:var(--surface);border-radius:14px;width:min(640px,100%);padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ven h2{margin:0 0 12px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form .full{grid-column:1/-1}
.form>*{min-width:0}
.form select{width:100%;max-width:100%}
.ccveh{flex-direction:row!important;align-items:flex-start!important}
.ccgrupo{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;font-size:14px}
.form textarea{min-height:80px}
.pie{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.archivos{display:flex;flex-direction:column;gap:4px;font-weight:400;color:var(--text)}
.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:13px;border:1px solid var(--line)}
.linea{list-style:none;margin:0;padding:0}
.linea li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.linea .h{color:var(--muted);font-size:12px}
.linea .t-novedad{color:var(--bad);font-weight:700}
.linea img{max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
.login{display:grid;place-items:center;min-height:80vh}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(360px,92vw)}
.login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--surface)}
.ident{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ident .por{color:var(--warn);font-weight:700}
.ident .si{color:var(--ok);font-weight:700}
.ident .no{color:var(--bad);font-weight:700}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comparar figure{margin:0;background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.comparar img{width:100%;height:320px;object-fit:contain;border-radius:8px;background:#000;cursor:zoom-in}
.comparar figcaption{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
/* 👤 Conductores */
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filtros .b.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.filtros .num{background:var(--surface-2);border-radius:99px;padding:0 6px;font-size:12px}
.conds td{font-size:13px}
.pdueno{margin-bottom:6px}
.pdueno:last-child{margin-bottom:0}
.conds tr.arch td{color:var(--muted);background:var(--surface-2)}
.prs{max-width:300px}
.pr{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;background:var(--warn-soft);color:var(--warn)}
.pr-Duplicado{background:var(--bad-soft);color:var(--bad)}
.si{color:var(--ok);font-weight:700}
td.antes{color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(220,38,38,.4)}
td.despues{color:var(--ok);font-weight:600}
@media (max-width:600px){.form{grid-template-columns:1fr} header .der{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.API_URL || 'https://script.google.com/macros/s/AKfycbz_st7NWwfY57QfMyTBLGxnufoIMgvlh3wKIwgi2PuzcrT409dFKI7iPsz3hOhUFKQ0/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
const qs = new URLSearchParams(location.search);
let CLAVE = qs.get('clave') || ls.get('despacho_clave') || '';
let USUARIO = ls.get('despacho_usuario') || '';
const CON_PRUEBA = new URLSearchParams(location.search).get('prueba') === '1';   // viajes de prueba (PRUEBA ETP): solo con ?prueba=1
// desde la Bandeja del tablero (7-nov): ?pestana=conductores&reg=conductores|vehiculos&filtro=problemas&buscar=… abre directo lo que hay que corregir
let D = null, pestana = qs.get('pestana') || ls.get('despacho_tab') || 'curso', filtro = qs.get('buscar') || '';
const fotos = {};

async function pedir(params) {
  // los viajes de prueba (PRUEBA ETP) solo salen con despacho.html?prueba=1
  const r = await fetch(API + '?' + new URLSearchParams(Object.assign({ vista: 'despacho', formato: 'json', clave: CLAVE }, CON_PRUEBA ? { prueba: '1' } : {}, params)));
  return r.json();
}
async function postear(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ clave: CLAVE, usuario: USUARIO }, body)) });
  return r.json();
}

function login(error) {
  $('#app').innerHTML = `<div class="login"><form onsubmit="entrar(event)"><h2 style="margin:0">Despacho de conductores</h2>
    <p style="color:var(--muted);margin:4px 0 0">Entrapetrol · Reckitt</p>
    <input name="usuario" placeholder="Su nombre" value="${esc(USUARIO)}" required>
    <input name="clave" type="password" placeholder="Clave del equipo" value="${esc(CLAVE)}" required>
    ${error ? '<div style="color:var(--bad)">Clave incorrecta</div>' : ''}
    <button class="b b-pri" style="width:100%;justify-content:center">Entrar</button></form></div>`;
}
function entrar(e) {
  e.preventDefault();
  const f = e.target;
  CLAVE = f.clave.value.trim(); USUARIO = f.usuario.value.trim();
  ls.set('despacho_usuario', USUARIO);
  cargar();
}

// fresco (10-nov): el botón 🔄 pide los datos sin el caché del servidor
// 10-nov (velocidad, "despachos tarda demasiado en cargar"): Despacho abre al instante con lo último que este navegador cargó
// (misma clave, menos de 12 h; igual que el tablero, datos.js) y pide los datos nuevos por detrás. Arriba dice de qué hora son
// los datos. Lo guardado se borra si la clave deja de servir. Los turnos y el registro de conductores se piden al mismo tiempo que
// las asignaciones, no después (antes eran dos esperas seguidas).
const ULTIMA = 'despacho_ultima' + (CON_PRUEBA ? '_p' : ''), ULTIMA_HORAS = 12;
function guardarUltima(d) { try { localStorage.setItem(ULTIMA + '-d', JSON.stringify(d)); localStorage.setItem(ULTIMA, JSON.stringify({ c: CLAVE, t: Date.now() })); } catch (e) { borrarUltima(); } }
function borrarUltima() { try { localStorage.removeItem(ULTIMA); localStorage.removeItem(ULTIMA + '-d'); } catch (e) { } }
function ultimaGuardada() {
  try { const m = JSON.parse(localStorage.getItem(ULTIMA) || 'null');
    if (!m || m.c !== CLAVE || Date.now() - m.t > ULTIMA_HORAS * 36e5) return null;
    const d = JSON.parse(localStorage.getItem(ULTIMA + '-d') || 'null'); return d && d.ok ? d : null;
  } catch (e) { return null; }
}
// 10-nov ("¿quién recarga?"): si no hay conexión, arriba queda fijo y en rojo "Sin conexión · datos de tal hora" mientras dure;
// Despacho sigue intentando solo (cada 20 s en ese estado) y el aviso se quita al volver a conectar. Nadie tiene que recargar.
let sinConexion = false;
const textoHora = () => sinConexion ? `<b style="color:var(--bad)">⚠ Sin conexión · datos de ${esc(D.hora)} · se actualiza solo al volver</b> · ${esc(USUARIO)}`
  : `datos de ${esc(D.hora)}${D.guardado ? ' · actualizando…' : ''} · ${esc(USUARIO)}`;
function marcarConexion(falla) { if (sinConexion === falla) return; sinConexion = falla; const h = $('.hora'); if (h && D) h.innerHTML = textoHora(); }
async function cargar(silencioso, fresco) {
  if (!CLAVE) return login();
  let deGuardado = false;
  if (!D && !silencioso && USUARIO) {
    const u = ultimaGuardada();
    if (u) try { D = u; D.turnos = null; D.guardado = true; pintar(); deGuardado = true; } catch (e) { D = null; borrarUltima(); }
  }
  if (!D && !silencioso) $('#app').innerHTML = '<div class="vacio">Cargando…</div>';
  // los turnos (carga del equipo) y el registro salen a la vez que las asignaciones; si la clave no sirve, fallan solos
  if (USUARIO) { cargarTurnos(); if (pestana === 'conductores' || !CONDS) cargarConductores(); }
  try {
    const d = await pedir(fresco ? { fresco: '1' } : {});
    if (!d.ok) { if (d.error === 'clave') { CLAVE = ''; ls.set('despacho_clave', ''); borrarUltima(); D = null; return login(true); } throw new Error(d.error); }
    ls.set('despacho_clave', CLAVE);
    if (!USUARIO) return login();   // falta el nombre: se pide en el formulario (prompt() no funciona en todos los navegadores)
    guardarUltima(d); sinConexion = false;
    D = d; D.turnos = turnosHora ? TURNOS : null;
    if (!deGuardado || !$('#velo')) pintar();   // si ya se pintó lo guardado y hay una ventana abierta, no se le repinta debajo
    cargarTurnos();
    if (pestana === 'conductores' || !CONDS) cargarConductores();   // por si entró con el formulario (sin nombre al abrir)
  } catch (e) { if (D) marcarConexion(true);   // con datos en pantalla (guardados o de hace un rato): aviso fijo arriba
    if (!silencioso) toast(D ? 'Sin conexión: se muestran los datos de ' + D.hora + '. Se actualiza solo al volver.' : 'No se pudo cargar: ' + e.message); }
}
// conductores enturnados y disponibles en la app Viajes ETP (turnos.html): vienen con los datos del tablero
// (turnosConductores, Conductores.gs resumenTurnos_: últimos 10 días, sin los retirados); se piden aparte para no demorar Despacho
let TURNOS = [], turnosHora = 0, DESTINOS = {}, VIAJES = [], REGISTRO = null, CALC = {};   // CALC: lo que el tablero calcula de cada viaje (etapa y qué pasa hoy)   // REGISTRO: vehículos y conductores (cédula para la orden de cargue)   // DESTINOS: id del viaje -> país o bodega (Despacho no los trae)
async function cargarTurnos(forzar) {
  if (!forzar && (cargarTurnos.enCurso || Date.now() - turnosHora < 5 * 60e3)) return;
  cargarTurnos.enCurso = true;
  try {
    const j = await (await fetch(API + '?' + new URLSearchParams({ formato: 'json', clave: CLAVE }))).json();
    if (!j.ok) { cargarTurnos.enCurso = false; return; }
    TURNOS = j.turnosConductores || []; turnosHora = Date.now();
    VIAJES = (j.viajes || []).filter(v => CON_PRUEBA || String(v.empresa || '').trim().toUpperCase() !== 'PRUEBA ETP'); REGISTRO = j.registro || null;   // también para 📧 Orden de cargue (destino, motonave, puerto, fechas)
    VIAJES.forEach(v => { DESTINOS[v.id] = v.operacion === 'EXPO' ? v.pais : (v.bodega || v.destino); });
    CALC = j.calc || {};
    if (D) { D.turnos = TURNOS; if (!$('#velo')) pintar(); }
  } catch (e) { /* sin turnos: Despacho sigue igual */ }
  cargarTurnos.enCurso = false;
}
const enturnadosDe = v => (D.turnos || []).filter(t => t.tipo === 'Turno' && t.viajeId === v.id);

/* ---------- cálculo ---------- */
const activa = a => a.estado === 'Activa';
function eventosDe(token) { return D.eventos.filter(e => e.token === token).sort((x, y) => new Date(x.fechaCliente || x.fecha) - new Date(y.fechaCliente || y.fecha)); }
function novedadesRecientes() {
  const lim = Date.now() - 24 * 3600e3;
  return D.eventos.filter(e => e.tipo === 'novedad' && new Date(e.fecha) > lim).sort((x, y) => new Date(y.fecha) - new Date(x.fecha));
}
function asignacionDe(v) {
  return D.asignaciones.find(a => a.estado !== 'Anulada' && (a.viajeId === v.id || (String(a.booking) === String(v.booking) && a.placa === v.placa && v.placa)));
}
function hace(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min';
  const h = Math.floor(m / 60); if (h < 24) return 'hace ' + h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
  return 'hace ' + Math.floor(h / 24) + ' d';
}
function fh(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}
function citaTxt(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d) || !/T\d/.test(s)) return s;
  return d.toLocaleString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
}

/* ---------- pantalla ---------- */
function pintar() {
  const curso = D.asignaciones.filter(activa);
  const term = D.asignaciones.filter(a => !activa(a));
  const libres = D.viajes.filter(v => !asignacionDe(v));
  const nEnt = (D.turnos || []).filter(t => t.tipo === 'Turno').length, nDisp = (D.turnos || []).filter(t => t.tipo === 'Disponible').length;
  const nov = novedadesRecientes();
  const porRevisar = D.asignaciones.filter(a => a.verificacion && a.verificacion.estado === 'Por revisar' && a.estado !== 'Anulada');
  const f = filtro.toLowerCase();
  const pasa = o => !f || JSON.stringify([o.booking, o.placa, o.conductor, o.operacion, o.contenedor]).toLowerCase().includes(f);
  ls.set('despacho_tab', pestana);

  $('#app').innerHTML = `
  <header>
    <h1>🚛 Despacho de conductores · <b>Reckitt</b></h1>
    <span class="hora">${textoHora()}</span>
    <div class="der">
      <input type="search" placeholder="Buscar booking, placa, conductor" value="${esc(filtro)}" oninput="filtro=this.value;pintar();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
      <button class="b" onclick="cargar(false, true);cargarTurnos(true)">🔄</button>
      <button class="b" onclick="confirmarCargue()" title="Orden de cargue por correo (contenedor vacío, llenado en planta o retiro en puerto): placa, conductor, fecha y hora, lugar y la imagen de la orden">📧 Orden de cargue</button>
      <button class="b b-pri" onclick="formulario()">+ Nueva asignación</button>
    </div>
  </header>
  <main>
    ${nov.length ? `<div class="alerta"><h3>⚠️ Novedades de conductores (últimas 24 h)</h3>${nov.slice(0, 6).map(e => {
      const a = D.asignaciones.find(x => x.token === e.token) || {};
      return `<div class="it"><b>${esc(e.pasoTexto)}</b> · ${esc(e.conductor || '')} <span class="placa">${esc(e.placa)}</span> · ${esc(e.booking)}
        ${e.texto ? `· “${esc(e.texto)}”` : ''} <span class="hora">${hace(e.fecha)}</span>
        ${e.lat ? `<a class="b b-mini" target="_blank" href="https://maps.google.com/?q=${e.lat},${e.lng}">📍 Mapa</a>` : ''}
        ${a.telefono ? `<a class="b b-mini b-wa" target="_blank" href="https://wa.me/${a.telefono}">💬</a>` : ''}
        <button class="b b-mini" onclick="detalle('${e.token}')">Ver</button></div>`;
    }).join('')}</div>` : ''}
    ${porRevisar.length ? `<div class="alerta" style="background:var(--warn-soft);border-color:var(--warn)"><h3 style="color:var(--warn)">🪪 Identidades por revisar</h3>${porRevisar.map(a =>
      `<div class="it"><b>${esc(a.conductor || 'Conductor')}</b> <span class="placa">${esc(a.placa)}</span> · ${esc(a.booking)} <span class="hora">${hace(a.verificacion.fecha)}</span>
        <button class="b b-mini" onclick="revisar('${a.token}')">Comparar fotos</button></div>`).join('')}</div>` : ''}
    <div class="tabs">
      <button class="${pestana === 'curso' ? 'on' : ''}" onclick="pestana='curso';pintar()">En curso<span class="num">${curso.length}</span></button>
      <button class="${pestana === 'libres' ? 'on' : ''}" onclick="pestana='libres';pintar()">Viajes sin asignar<span class="num">${libres.length}</span></button>
      <button class="${pestana === 'term' ? 'on' : ''}" onclick="pestana='term';pintar()">Terminadas / anuladas<span class="num">${term.length}</span></button>
      <button class="${pestana === 'turnos' ? 'on' : ''}" onclick="pestana='turnos';pintar()">🙋 Enturnados<span class="num">${nEnt}</span>${nDisp ? `<span class="num" title="Disponibles">🟢 ${nDisp}</span>` : ''}</button>
      <button class="${pestana === 'ofertas' ? 'on' : ''}" onclick="pestana='ofertas';pintar()">🔒 Ofertas<span class="num">${(D.ofertas || []).filter(c => c.estado === 'Abierta').length}</span>${(D.ofertas || []).some(c => c.estado === 'Abierta' && !c.abierta) ? '<span class="num" style="background:var(--warn-soft);color:var(--warn)" title="Cerraron: elegir ganador">⚑ elegir</span>' : ''}</button>
      <button class="${pestana === 'conductores' ? 'on' : ''}" onclick="pestana='conductores';cargarConductores();pintar()">👤 Conductores y vehículos${CONDS ? `<span class="num">${condVigentes().length}</span>${(condConProblema().length + vehConProblema()) ? `<span class="num" style="background:var(--warn-soft);color:var(--warn)" title="Con algo por revisar">⚠ ${condConProblema().length + vehConProblema()}</span>` : ''}` : ''}</button>
    </div>
    ${pestana === 'curso' ? tarjetas(curso.filter(pasa)) : pestana === 'term' ? tarjetas(term.filter(pasa).reverse()) : pestana === 'turnos' ? vistaTurnos(f) : pestana === 'ofertas' ? vistaOfertas(f) : pestana === 'conductores' ? vistaConductores(f) : tablaLibres(libres.filter(pasa))}
  </main>`;
}

function tarjetas(lista) {
  if (!lista.length) return '<div class="vacio">No hay asignaciones aquí. Use “+ Nueva asignación” o la pestaña “Viajes sin asignar”.</div>';
  return `<div class="grid">${lista.map(a => {
    const n = a.hechos.length, t = a.pasos.length, ult = a.hechos[n - 1];
    const sig = a.pasos[n];
    const evs = eventosDe(a.token);
    const ultNov = evs.filter(e => e.tipo === 'novedad').pop();
    const quieto = activa(a) && n > 0 && n < t && (Date.now() - new Date(ult.fecha)) > 6 * 3600e3;
    const sinAbrir = activa(a) && n === 0;
    // 7-nov: mientras el conductor no use la app (sin pasos ni aceptación), la tarjeta sigue al TABLERO: barra, "Sigue" y pasos salen
    // de lo que el equipo registró (CALC: avance, paradas, sigue). No se inventa nada en la app: solo se muestra el avance real
    const tb = a.viajeId && CALC[a.viajeId], segunTablero = sinAbrir && !a.verificacion && tb && tb.paradas;
    return `<div class="card">
      <div class="top"><span class="op ${a.operacion}">${a.operacion}</span>
        <div><div class="bk">Booking ${esc(a.booking)}</div>
        <div class="sub"><span class="placa">${esc(a.placa || 'sin placa')}</span> · ${esc(a.conductor || 'sin conductor')}${a.contenedor ? ' · ' + esc(a.contenedor) : ''}</div></div>
        ${a.estado !== 'Activa' ? `<span class="op" style="margin-left:auto">${esc(a.estado)}</span>` : ''}</div>
      ${a.cita ? `<div class="sub">📅 ${esc(citaTxt(a.cita))}${a.lugarCita ? ' · ' + esc(a.lugarCita) : ''}</div>` : ''}
      <div class="barra"><i style="width:${segunTablero ? Math.round(100 * tb.avance / tb.paradas) : Math.round(100 * n / t)}%"></i></div>
      ${segunTablero
        ? `<div class="estado"><span>📋 <b>${esc(tb.ahora || tb.etapa || '')}</b> <span class="sub">· según el tablero</span></span><span>${tb.avance}/${tb.paradas}</span></div>
          ${tb.sigue ? `<div class="sub">Sigue: ${esc(tb.sigue)}</div>` : ''}<div class="ident sub">📱 El conductor aún no usa la app: el avance sale del tablero</div>`
        : `<div class="estado"><span>${n ? `<b>${esc(a.pasos[n - 1].corto)}</b> · <span class="${quieto ? 'tarde' : ''}">${hace(ult.fecha)}</span>` : (sinAbrir ? '<span class="sub">El conductor aún no usa la app</span>' : '')}</span><span>${n}/${t}</span></div>
          ${tb ? `<div class="sub">📋 Torre de Control: <b>${esc(tb.ahora || tb.etapa || '')}</b></div>` : ''}
          ${sig && activa(a) ? `<div class="sub">Sigue: ${sig.icono} ${esc(sig.texto)}</div>` : ''}
          ${identidadHtml(a)}`}
      ${ultNov ? `<div class="nov">⚠️ ${esc(ultNov.pasoTexto)}${ultNov.texto ? ': ' + esc(ultNov.texto) : ''} · ${hace(ultNov.fecha)}</div>` : ''}
      <div class="acc">
        <button class="b b-mini b-wa" onclick="whatsapp('${a.token}')">💬 WhatsApp</button>
        ${activa(a) ? `<button class="b b-mini" onclick="formulario('${a.token}')">✏️ Cita / archivos</button>` : ''}
        <button class="b b-mini" onclick="detalle('${a.token}')">📋 Detalle</button>
        ${activa(a) && a.booking ? `<button class="b b-mini" onclick='confirmarCargue(${esc(JSON.stringify(String(a.booking)))})'>📧 Orden de cargue</button>` : ''}
        ${activa(a) ? `<button class="b b-mini" onclick="cerrar('${a.token}','terminar')">✔ Terminar</button>
          <button class="b b-mini" onclick="cerrar('${a.token}','anular')">⛔ Anular</button>` : ''}
      </div></div>`;
  }).join('')}</div>`;
}

function tablaLibres(lista) {
  if (!lista.length) return '<div class="vacio">Todos los viajes abiertos de la hoja ya tienen conductor asignado en la app.</div>';
  return `<div class="tabla"><table><thead><tr><th>Op.</th><th>Booking</th><th>Placa</th><th>Conductor</th><th>Retiro</th><th>Llenado</th><th>Patio / Puerto</th><th>Status</th><th>🙋 Enturnados</th><th>🔒 Oferta</th><th></th></tr></thead><tbody>
    ${lista.map(v => `<tr><td><span class="op ${v.operacion}">${esc(v.operacion)}</span></td><td><b>${esc(v.booking)}</b></td>
      <td><span class="placa">${esc(v.placa || '—')}</span></td><td>${esc(v.conductor || '—')}</td><td>${esc(v.fechaRetiro)}</td><td>${esc(v.fechaCargue)}</td>
      <td>${esc([v.patio, v.puerto].filter(Boolean).join(' / '))}</td><td>${esc(v.situacion)}</td>
      <td>${enturnadosDe(v).map(t => botonTurno(v, t)).join(' ') || '<span class="sub">—</span>'}</td>
      <td>${celdaOferta(v)}</td>
      <td><button class="b b-mini b-pri" onclick="formulario(null,'${esc(v.id)}')">Asignar</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- enturnados y disponibles (app Viajes ETP) ---------- */
const nombreViaje = v => `${v.operacion} ${DESTINOS[v.id] || (v.operacion === 'EXPO' ? v.pais : v.bodega || v.destino) || ''}`.trim();
const primerDia = v => v.fechaRetiro || v.fechaCargue || '';
const diaTxt = iso => iso ? new Date(iso.slice(0, 10) + 'T12:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }) : 'sin fecha';
const celTurno = t => String(t.telefono || '').replace(/^57(?=\d{10}$)/, '');
function botonTurno(v, t) {
  return `<button class="b b-mini b-pri" onclick='asignarTurno(${JSON.stringify(v.id)}, ${JSON.stringify({ placa: t.placa, conductor: t.conductor, telefono: celTurno(t) })})'
    title="Se enturnó ${esc(hace(t.creado))} · cel ${esc(celTurno(t))}">🙋 ${esc(t.placa)} · ${esc(String(t.conductor).split(' ').slice(0, 2).join(' '))}</button>`;
}
function asignarTurno(viajeId, pre) { formulario(null, viajeId, pre); }
function vistaTurnos(f) {
  if (!D.turnos) return '<div class="vacio">Cargando los turnos de la app…</div>';
  const pasaT = t => !f || JSON.stringify([t.placa, t.conductor, t.viajeId, t.ciudad]).toLowerCase().includes(f);
  const turnos = D.turnos.filter(t => t.tipo === 'Turno' && pasaT(t)), disp = D.turnos.filter(t => t.tipo === 'Disponible' && pasaT(t));
  const viajeDe = id => D.viajes.find(v => v.id === id);
  const ids = [...new Set(turnos.map(t => t.viajeId))].sort((a, b) => String(primerDia(viajeDe(a) || {}) || '9').localeCompare(String(primerDia(viajeDe(b) || {}) || '9')));
  // el celular de la app de turnos llega con 10 dígitos: WhatsApp necesita el 57 delante (7-nov)
  const wa = (t, txt) => t.telefono ? `<a class="b b-mini b-wa" target="_blank" href="https://wa.me/${String(t.telefono).replace(/\D/g, '').replace(/^(3\d{9})$/, '57$1')}?text=${encodeURIComponent(txt)}">💬</a>` : '';
  const porViaje = ids.length ? `<div class="grid">${ids.map(id => {
    const v = viajeDe(id), L = turnos.filter(t => t.viajeId === id).sort((a, b) => String(a.creado).localeCompare(String(b.creado)));
    const asig = v && asignacionDe(v);
    return `<div class="card"><div class="top"><span class="op ${v ? v.operacion : ''}">${esc(v ? v.operacion : '')}</span>
        <div><div class="bk">${esc(id)} · ${esc(v ? nombreViaje(v) : 'viaje cerrado o no encontrado')}</div>
        <div class="sub">${v ? `${v.booking ? 'Booking ' + esc(v.booking) + ' · ' : ''}<b>${esc(diaTxt(primerDia(v)))}</b> · ${asig ? `asignado a <span class="placa">${esc(asig.placa || '')}</span>` : v.placa ? `vehículo <span class="placa">${esc(v.placa)}</span>` : '<span class="tarde">sin vehículo</span>'}` : ''}</div></div></div>
      ${L.map((t, i) => `<div class="estado" style="align-items:center"><span>${i + 1}.º <span class="placa">${esc(t.placa)}</span> ${esc(t.conductor)} <span class="sub">· ${esc(celTurno(t))} · ${esc(hace(t.creado))}</span></span>
        <span style="display:flex;gap:4px">${v && !asig && !v.placa ? botonTurno(v, t) : ''}${wa(t, `Hola ${String(t.conductor).split(' ')[0]}, sobre el viaje ${v ? nombreViaje(v) + ' del ' + diaTxt(primerDia(v)) : id} al que se enturnó: `)}</span></div>`).join('')}
    </div>`;
  }).join('')}</div>` : '<div class="vacio">Ningún conductor se ha enturnado en los últimos 10 días.</div>';
  const libres = D.viajes.filter(v => !asignacionDe(v) && !v.placa && primerDia(v)).sort((a, b) => primerDia(a).localeCompare(primerDia(b)));
  const disponibles = disp.length ? `<div class="tabla"><table><thead><tr><th>Vehículo y conductor</th><th>Disponible</th><th>Asignar a un viaje sin vehículo</th><th></th></tr></thead><tbody>
    ${disp.map(t => { const ops = libres.filter(v => !t.desde || primerDia(v) >= t.desde);
      return `<tr><td><span class="placa">${esc(t.placa)}</span> ${esc(t.conductor)}<div class="sub">${esc(celTurno(t))}</div></td>
        <td>${t.desde ? 'desde ' + esc(diaTxt(t.desde)) : 'ya'}${t.ciudad ? ' · ' + esc(t.ciudad) : ''}<div class="sub">avisó ${esc(hace(t.creado))}</div></td>
        <td>${ops.length ? `<select onchange='if(this.value) asignarTurno(this.value, ${JSON.stringify({ placa: t.placa, conductor: t.conductor, telefono: celTurno(t) })})'><option value="">Elegir viaje…</option>
          ${ops.map(v => `<option value="${esc(v.id)}">${esc(diaTxt(primerDia(v)))} · ${esc(v.id)} · ${esc(nombreViaje(v))}</option>`).join('')}</select>` : '<span class="sub">No hay viajes sin vehículo desde esa fecha</span>'}</td>
        <td>${wa(t, `Hola ${String(t.conductor).split(' ')[0]}, vimos que está disponible${t.desde ? ' desde el ' + diaTxt(t.desde) : ''}: `)}</td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="vacio">Nadie ha reportado estar disponible en los últimos 10 días.</div>';
  return `<p class="sub" style="margin:0 0 10px">Lo que los conductores marcaron en la app Viajes ETP (últimos 10 días, sin los que se retiraron). 🙋 abre la asignación con el vehículo, el conductor y su celular ya puestos.</p>
    <h3 style="margin:0 0 8px">🙋 Enturnados por viaje</h3>${porViaje}
    <h3 style="margin:18px 0 8px">🟢 Disponibles</h3>${disponibles}`;
}

/* ---------- ofertas selladas (app Viajes ETP, 8-nov) ----------
   Operaciones abre a oferta un viaje sin vehículo: referencia para el conductor (opcional, nunca la tarifa del cliente) y hora de
   cierre. Los conductores del registro ofertan desde la app; nadie ve las ofertas antes del cierre (aquí solo cuántas hay). Al
   cerrar se ven ordenadas por precio y operaciones elige: eso abre la asignación con el ganador puesto (Conductores.gs). */
const pesos = n => '$ ' + Number(n || 0).toLocaleString('es-CO');
const ofertaDe = id => (D.ofertas || []).find(c => c.viajeId === id);
const cierreTxt = iso => new Date(iso).toLocaleString('es-CO', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function celdaOferta(v) {
  const c = ofertaDe(v.id);
  if (!c) return v.placa ? '<span class="sub">—</span>' : `<button class="b b-mini" onclick="abrirOferta('${esc(v.id)}')">🔒 Abrir a oferta</button>`;
  if (c.estado === 'Adjudicada') return '<span class="sub">Con ganador</span>';
  return c.abierta ? `<button class="b b-mini" onclick="pestana='ofertas';pintar()" title="Cierra ${esc(cierreTxt(c.cierre))}">🔒 ${c.n} oferta${c.n === 1 ? '' : 's'} · abierta</button>`
    : `<button class="b b-mini b-pri" onclick="pestana='ofertas';pintar()">⚑ Cerró · elegir (${c.n})</button>`;
}
function abrirOferta(viajeId) {
  const v = D.viajes.find(x => x.id === viajeId), c = ofertaDe(viajeId);
  // cierre por defecto: 24 h antes del primer evento (a las 12 m.); si ya pasó, en 2 horas
  const pd = primerDia(v || {}), dia = pd ? new Date(pd.slice(0, 10) + 'T12:00:00-05:00') : null;
  let cierre = c && c.estado === 'Abierta' ? new Date(c.cierre) : dia ? new Date(dia - 864e5) : new Date(Date.now() + 2 * 36e5);
  if (cierre < new Date(Date.now() + 30 * 6e4)) cierre = new Date(Date.now() + 2 * 36e5);
  const local = new Date(cierre.getTime() - 5 * 36e5).toISOString().slice(0, 16);   // hora de Colombia para el campo
  ventana(`<h2>🔒 ${c && c.estado === 'Abierta' ? 'Cambiar oferta' : 'Abrir a oferta'} · ${esc(viajeId)}</h2>
    <p class="sub">${v ? esc(nombreViaje(v)) + ' · ' + esc(diaTxt(primerDia(v))) : ''}. Lo verán los conductores en la app Viajes ETP; solo pueden ofertar los del registro con datos completos.</p>
    <form class="form" id="fo" onsubmit="guardarOferta(event,'${esc(viajeId)}')">
      <label>Referencia para el conductor (opcional)<input name="referencia" inputmode="numeric" placeholder="Ej: 3.200.000" value="${c && c.referencia ? Number(c.referencia).toLocaleString('es-CO') : ''}"
        oninput="const d=this.value.replace(/\D/g,'').slice(0,8);this.value=d?Number(d).toLocaleString('es-CO'):''"></label>
      <label>Cierra (hora de Colombia)<input type="datetime-local" name="cierre" required value="${local}"></label>
      <p class="sub full">La referencia la ve el conductor: nunca ponga la tarifa del cliente. Las ofertas se abren aquí a la hora de cierre.</p>
      <div class="pie full"><button type="button" class="b" onclick="cerrarVentana()">Cancelar</button>
        ${c && c.estado === 'Abierta' ? `<button type="button" class="b" onclick="cancelarOferta('${esc(viajeId)}')">⛔ Cancelar la oferta</button>` : ''}
        <button class="b b-pri" id="bofertar">${c && c.estado === 'Abierta' ? 'Guardar' : 'Abrir a oferta'}</button></div>
    </form>`);
}
async function guardarOferta(e, viajeId) {
  e.preventDefault(); const f = e.target, b = $('#bofertar'); b.disabled = true;
  try {
    const r = await postear({ action: 'abrirOferta', viajeId, referencia: f.referencia.value.replace(/\D/g, ''), cierre: f.cierre.value });
    if (!r.ok) throw new Error(r.error);
    cerrarVentana(); toast('🔒 Viaje abierto a oferta'); await cargar(true);
  } catch (err) { b.disabled = false; toast('Error: ' + err.message); }
}
async function cancelarOferta(viajeId) {
  if (!confirm('¿Cancelar la oferta de ' + viajeId + '? Los conductores que ofertaron verán "No quedó esta vez".')) return;
  const r = await postear({ action: 'cancelarOferta', viajeId });
  if (!r.ok) return toast('Error: ' + r.error);
  cerrarVentana(); toast('Oferta cancelada'); await cargar(true);
}
async function elegirOferta(viajeId, ofertaId) {
  const c = ofertaDe(viajeId), o = c && c.ofertas.find(x => x.id === ofertaId);
  if (!o || !confirm(`¿Elegir a ${o.conductor} (${o.placa}) por ${pesos(o.valor)}? Los demás verán "No quedó esta vez".`)) return;
  const r = await postear({ action: 'elegirOferta', viajeId, ofertaId });
  if (!r.ok) return toast('Error: ' + r.error);
  await cargar(true);
  toast(`Ganador: ${r.ganador.conductor} · ${pesos(r.ganador.valor)}. Complete la asignación.`);
  formulario(null, viajeId, { placa: r.ganador.placa, conductor: r.ganador.conductor, telefono: r.ganador.telefono });
}
function vistaOfertas(f) {
  const L = (D.ofertas || []).filter(c => !f || JSON.stringify(c).toLowerCase().includes(f))
    .sort((a, b) => (a.estado === 'Adjudicada') - (b.estado === 'Adjudicada') || String(a.cierre).localeCompare(String(b.cierre)));
  const viajeDe = id => D.viajes.find(v => v.id === id);
  return `<p class="sub" style="margin:0 0 10px">Ofertas selladas de los conductores en la app Viajes ETP (últimos 15 días). Antes del cierre solo se sabe cuántas hay; al cerrar se ven por precio y usted elige. Para abrir un viaje a oferta: pestaña “Viajes sin asignar” → 🔒.</p>
    ${L.length ? `<div class="grid">${L.map(c => { const v = viajeDe(c.viajeId), asig = v && asignacionDe(v);
      return `<div class="card"><div class="top"><span class="op ${v ? v.operacion : ''}">${esc(v ? v.operacion : '')}</span>
        <div><div class="bk">${esc(c.viajeId)} · ${esc(v ? nombreViaje(v) : 'viaje cerrado o no encontrado')}</div>
        <div class="sub">${v ? `${v.booking ? 'Booking ' + esc(v.booking) + ' · ' : ''}<b>${esc(diaTxt(primerDia(v)))}</b>` : ''}${c.referencia ? ' · referencia ' + pesos(c.referencia) : ''}</div></div>
        <span class="op" style="margin-left:auto">${c.estado === 'Adjudicada' ? '✔ Con ganador' : c.abierta ? '🔒 Abierta' : '⚑ Cerró'}</span></div>
        <div class="estado"><span>${c.abierta ? `Cierra <b>${esc(cierreTxt(c.cierre))}</b>` : `Cerró ${esc(cierreTxt(c.cierre))}`}</span><span>${c.n} oferta${c.n === 1 ? '' : 's'}</span></div>
        ${c.abierta ? `<div class="sub">🔒 Selladas: se ven a la hora de cierre.</div>`
          : c.ofertas.length ? c.ofertas.map((o, i) => `<div class="estado" style="align-items:center"><span>${i + 1}. <b>${pesos(o.valor)}</b> · <span class="placa">${esc(o.placa)}</span> ${esc(o.conductor)} <span class="sub">· ${esc(o.telefono)}</span>${o.estado === 'Ganadora' ? ' <b>✔ ganadora</b>' : ''}</span>
              ${c.estado === 'Abierta' && o.estado === 'Enviada' ? `<button class="b b-mini b-pri" onclick="elegirOferta('${esc(c.viajeId)}','${esc(o.id)}')">Elegir</button>` : ''}</div>`).join('')
          : '<div class="sub">Nadie ofertó. Puede cambiar la hora de cierre para dejarla abierta más tiempo.</div>'}
        <div class="acc">${c.estado === 'Abierta' ? `<button class="b b-mini" onclick="abrirOferta('${esc(c.viajeId)}')">✏️ Referencia / cierre</button>` : ''}
          ${c.estado === 'Adjudicada' && v && !asig ? `<button class="b b-mini b-pri" onclick='formulario(null, ${JSON.stringify(c.viajeId)}, ${JSON.stringify((() => { const g = c.ofertas.find(o => o.estado === "Ganadora") || {}; return { placa: g.placa, conductor: g.conductor, telefono: g.telefono }; })())})'>Completar asignación</button>` : ''}</div>
      </div>`; }).join('')}</div>` : '<div class="vacio">Todavía no hay viajes abiertos a oferta.</div>'}`;
}

/* ---------- asignar / editar ---------- */
function telDe(conductor, placa) {
  const n = s => String(s || '').trim().toLowerCase();
  const d = D.directorio.find(x => conductor && n(x.conductor) === n(conductor)) || D.directorio.find(x => placa && n(x.placa) === n(placa));
  return d ? d.telefono : '';
}
function formulario(token, viajeId, pre) {
  const a = token ? D.asignaciones.find(x => x.token === token) : null;
  const v = viajeId ? D.viajes.find(x => x.id === viajeId) : null;
  const o = a || (v ? { operacion: v.operacion, booking: v.booking, placa: v.placa, conductor: v.conductor, viajeId: v.id,
    telefono: telDe(v.conductor, v.placa), lugarCita: v.operacion === 'EXPO' ? v.bodega || '' : v.puerto || '' } : { operacion: 'EXPO' });
  if (pre) Object.assign(o, pre);   // el conductor enturnado en la app (vistaTurnos / botonTurno)
  ventana(`<h2>${a ? 'Actualizar asignación' : 'Nueva asignación'}</h2>
    <form class="form" id="fa" onsubmit="guardarAsig(event, ${a ? `'${a.token}'` : 'null'})">
      <input type="hidden" name="viajeId" value="${esc(o.viajeId || '')}">
      <label>Operación<select name="operacion">${['EXPO', 'IMPO', 'NACIONAL'].map(x => `<option ${(o.operacion || 'EXPO') === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label>Booking<input name="booking" required value="${esc(o.booking || '')}"></label>
      <label>Placa<input name="placa" list="dlRegPlacas" value="${esc(o.placa || '')}" onchange="autoTel()" placeholder="Del registro"></label>
      <label>Conductor<input name="conductor" list="dlRegConds" value="${esc(o.conductor || '')}" onchange="autoTel()" placeholder="Del registro"></label>

function autoTel() {
  const f = $('#fa'), R = REGISTRO || {}, lista = t => String(t || '').split(/\s*[,/;]\s*/).map(x => x.replace(/[\s-]/g, '').toUpperCase()).filter(Boolean);
  const c = (R.conductores || []).find(x => nomC(x.nombre) === nomC(f.conductor.value));
  if (c && !f.placa.value && lista(c.placas).length === 1) f.placa.value = lista(c.placas)[0];
  if (!f.conductor.value && f.placa.value) { const P = f.placa.value.replace(/[\s-]/g, '').toUpperCase(), L = (R.conductores || []).filter(x => lista(x.placas).includes(P));
    if (L.length === 1) f.conductor.value = L[0].nombre; }
  if (!f.telefono.value) f.telefono.value = telDe(f.conductor.value, f.placa.value);
}
function leerArchivo(file) {
  return new Promise((ok, mal) => {
    if (/^image\//.test(file.type) && file.size > 600e3) {   // fotos grandes: se reducen para que carguen rápido en el celular
      const img = new Image();
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ nombre: file.name.replace(/\.\w+$/, '') + '.jpg', tipo: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.8) }); };
      img.onerror = mal; img.src = URL.createObjectURL(file); return;
    }
    const r = new FileReader(); r.onload = () => ok({ nombre: file.name, tipo: file.type, base64: r.result }); r.onerror = mal; r.readAsDataURL(file);
  });
}
async function guardarAsig(e, token) {
  e.preventDefault();
  const f = e.target, b = $('#bguardar');
  b.disabled = true; b.textContent = 'Guardando…';
  try {
    const datos = { action: 'asignar', token: token || undefined };
    ['operacion', 'booking', 'placa', 'conductor', 'telefono', 'contenedor', 'cita', 'lugarCita', 'instrucciones', 'viajeId'].forEach(k => datos[k] = f[k].value);
    datos.archivosNuevos = await Promise.all([...f.archivos.files].map(leerArchivo));
    datos.quitarArchivos = [...f.querySelectorAll('[name=quitar]:checked')].map(x => x.value);
    const r = await postear(datos);
    if (!r.ok) throw new Error(r.error);
    await cargar(true);

  } catch (err) { b.disabled = false; b.textContent = 'Reintentar'; toast('Error: ' + err.message); }
}

// 5-nov (usuario): módulo de órdenes de cargue por etapa (Cliente.gs ORDENES_CARGUE). La FECHA no se escribe aquí: es la de cada
// vehículo en el tablero según el tipo (campos de ORDENES_CARGUE; "las fechas deberían salir de lo que se ha llenado en el tablero");
// quien envía pone la hora. El lugar se sugiere (patio o puerto del viaje; la planta, la última usada) y se puede corregir.
const DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fdAnio = f => { const d = new Date(f + 'T12:00'); return `${DIAS_C[d.getDay()]} ${d.getDate()} ${MES_C[d.getMonth()]} ${d.getFullYear()}`; };   // como el tablero, con el año
const tipoCargue = () => { const f = $('#fcc'), k = f && (f.querySelector('[name=tipo]:checked') || {}).value; return k && CC_DATOS.tipos[k] ? CC_DATOS.tipos[k] : null; };
const fechaTablero = (v, T) => String((T.campos || []).map(k => v[k]).find(x => /^\d{4}-\d{2}-\d{2}/.test(String(x || ''))) || '').slice(0, 10);
// el conductor en el registro por su nombre o un alias (sin tildes ni mayúsculas; como buscarConductor del dominio)
const nomC = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const cedulaRegistro = nombre => { const n = nomC(nombre); if (!n || !REGISTRO) return '';
  const L = (REGISTRO.conductores || []).filter(x => [x.nombre].concat(String(x.alias || '').split(/[\/,;]/)).some(a => nomC(a) === n));
  const c = L.find(x => !/^archivad/i.test(x.estado || '')) || L[0]; return c && c.cedula || ''; };   // el vigente antes que el archivado
const PUERTOS = { BUN: 'Puerto de Buenaventura', CTG: 'Puerto de Cartagena', SMR: 'Puerto de Santa Marta' };
const bookingSel = () => { const f = $('#fcc'); return f && bookingsCargue().find(b => b.bk === f.booking.value); };
// el paso que sigue: IMPO retiro en puerto; EXPO vacío si el retiro es más adelante, si no llenado en planta
function tipoSugerido(x) {
  const v = x.viajes[0], hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
  // IMPO: retiro en puerto si la cita o el retiro es mañana o después; si no, el descargue en la bodega
  if (v.operacion === 'IMPO') return String(v.citaRetiro || v.fechaRetiro || '').slice(0, 10) > hoy ? 'puerto' : 'descargue';
  // la orden se manda antes del paso: retiro mañana o después → vacío; retiro hoy o ya pasó → llenado (se puede cambiar)
  return !v.fechaRetiro || String(v.fechaRetiro).slice(0, 10) > hoy ? 'vacio' : 'llenado';
}
function aplicarTipoCargue(aMano) {
  const f = $('#fcc'), x = bookingSel(); if (!f || !x) return;
  const tipo = (f.querySelector('[name=tipo]:checked') || {}).value, T = (CC_DATOS.tipos || {})[tipo]; if (!T) return;
  $('#ccHoraLbl').textContent = T.hora; $('#ccLugarLbl').textContent = T.lugar;
  const v = x.viajes[0];

function leerOrdenCargue(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('La orden de cargue debe ser una imagen (JPG o PNG)');
  const img = new Image();
  img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    CC_IMG = { tipo: 'image/jpeg', b64: url.split(',')[1] };
    $('#ccImg').innerHTML = `<div style="display:flex;gap:10px;align-items:center;margin-top:6px"><img src="${url}" style="max-width:120px;max-height:90px;border:1px solid var(--line);border-radius:6px">
      <span>${esc(file.name || 'imagen pegada')} · ${Math.round(CC_IMG.b64.length * 0.75 / 1024)} KB <button type="button" class="b b-mini" onclick="CC_IMG=null;$('#ccImg').innerHTML='';$('#fcc').orden.value=''">✕ Quitar</button></span></div>`; };
  img.onerror = () => toast('No se pudo leer la imagen (si es HEIC del iPhone, envíela como JPG o tome captura)');
  img.src = URL.createObjectURL(file);
}

    <span><b>${esc(x.nombre)}</b> · cédula ${esc(x.cedula || '—')} · cel ${esc(x.celular || '—')} · ${esc(x.placas || 'sin placas')} · ${x.viajes || 0} viajes</span></label>`;
  ventana(`<h2>🔗 Fusionar duplicados</h2>
    <p class="sub">Queda <b>${esc(c.nombre)}</b> (cédula ${esc(c.cedula || '—')}, cel ${esc(c.celular || '—')}). Los que marque se unen a él: sus nombres pasan a "También escrito como", sus placas se suman y quedan archivados (no se borran).</p>
    <form class="form" id="ffus" onsubmit="event.preventDefault();previaFusion(${i})">
      <div class="full archivos"><b class="sub">Posibles duplicados</b>${dups.length ? dups.map(j => fila(Object.assign({ j }, CONDS[j]))).join('') : '<span class="sub">El sistema no encontró duplicados de este conductor. Puede buscar otro abajo.</span>'}</div>
      <label class="full">Agregar otro conductor<select name="otro" onchange="agregarFusion(this)"><option value="">— elegir —</option>${otros.filter(x => !dups.includes(x.j)).sort((a, b) => a.nombre.localeCompare(b.nombre)).map(x => `<option value="${x.j}">${esc(x.nombre)} · ${esc(x.cedula || 'sin cédula')}</option>`).join('')}</select></label>
      <div class="full archivos" id="fusExtra"></div>
    </form>
    <div class="pie"><button class="b" onclick="cerrarVentana()">Cancelar</button><button class="b b-pri" form="ffus">Ver cambios</button></div>`, true);
  FUS_FILA = fila;
}
let FUS_FILA = null, FUS_ELEGIR = {};
function agregarFusion(sel) {
  const j = Number(sel.value); if (sel.value === '' || document.querySelector(`#ffus [name=sale][value="${j}"]`)) return;
  $('#fusExtra').insertAdjacentHTML('beforeend', FUS_FILA(Object.assign({ j }, CONDS[j])));
  document.querySelector(`#ffus [name=sale][value="${j}"]`).checked = true; sel.value = '';
}
function previaFusion(i, elegir) {
  const js = [...document.querySelectorAll('#ffus [name=sale]:checked')].map(x => Number(x.value));
  if (js.length) FUS_ELEGIR = { i, js };
  const sel = FUS_ELEGIR.i === i ? FUS_ELEGIR.js : js;
  if (!sel.length) return toast('Marque al menos un conductor para fusionar');
  previa({ op: 'fusionar', queda: CONDS[i].fila, salen: sel.map(j => CONDS[j].fila), elegir: elegir || {} }, '🔗 Fusionar en ' + CONDS[i].nombre, () => fusionarCond(i));
}
const CAMPOS_ELEGIR = { nombre: 'Nombre', cedula: 'Cédula', celular: 'Celular' };
// los conductores tienen datos distintos: la persona elige cuál queda (solo entre los que ya están en el registro)
function elegirFusion(i, r) {
  ventana(`<h2>🔗 ¿Qué dato queda?</h2><p class="sub">Los conductores tienen datos distintos. Elija el correcto (solo los que ya están en el registro).</p>
    <form class="form" id="felegir" onsubmit="event.preventDefault();previaFusion(${i},Object.fromEntries(new FormData(this)))">
    ${Object.keys(CAMPOS_ELEGIR).map(k => { const o = (r.elegir && r.elegir[k]) || null, fijo = !o && r.opciones ? (r.opciones[k] || [])[0] : '';
      return o ? `<div class="full ccgrupo">${CAMPOS_ELEGIR[k]}${o.map((x, n) => `<label class="ccveh" style="gap:8px;font-weight:400;color:var(--text)"><input type="radio" name="${k}" value="${esc(x)}" ${n ? '' : 'required'}> ${esc(x)}</label>`).join('')}</div>`
        : `<div class="full sub">${CAMPOS_ELEGIR[k]}: ${esc(fijo || '—')} (el mismo en todos)</div>`; }).join('')}
    </form>
    <div class="pie"><button class="b" onclick="fusionarCond(${i})">Volver</button><button class="b b-pri" form="felegir">Ver cambios</button></div>`, true);
}
function archivarCond(i) {
  const c = CONDS[i];
  ventana(`<h2>🗄 Archivar conductor</h2>
    <p class="sub"><b>${esc(c.nombre)}</b> · cédula ${esc(c.cedula || '—')} · ${c.viajes || 0} viajes. No se borra: queda en la hoja con Estado "Archivado", deja de contar en el registro y no se puede asignar. Se puede restaurar.</p>
    <form class="form" id="farch" onsubmit="event.preventDefault();previa({op:'archivar',antes:CONDS[${i}].fila,motivo:this.motivo.value},'🗄 Archivar ${esc(c.nombre).replace(/'/g, '')}',()=>archivarCond(${i}))">
      <label class="full">Motivo<input name="motivo" required minlength="4" placeholder="Ej.: fila repetida sin datos, ya no trabaja con nosotros"></label></form>
    <div class="pie"><button class="b" onclick="cerrarVentana()">Cancelar</button><button class="b b-pri" form="farch">Ver cambios</button></div>`, true);
}
function restaurarCond(i) { previa({ op: 'restaurar', antes: CONDS[i].fila }, '↩ Restaurar ' + CONDS[i].nombre, () => cerrarVentana()); }

/* ---------- 🚚 Vehículos del registro: placa, empresa, propietario y su celular (Registro.gs cambiarVehiculos_) ---------- */
function selectorRegistro() {
  const nV = (VEHS || []).filter(v => !archivadoC(v) && v.problemas.length).length, nC = condConProblema().length;
  const b = (k, t, n) => `<button class="${condVista === k ? 'on' : ''}" onclick="condVista='${k}';condFiltro='todos';pintar()">${t}${n ? `<span class="num" style="background:var(--warn-soft);color:var(--warn)">⚠ ${n}</span>` : ''}</button>`;
  return `<div class="tabs" style="margin-bottom:10px">${b('conductores', '👤 Conductores', nC)}${b('vehiculos', '🚚 Vehículos y propietarios', nV)}</div>`;
}
const FILTROS_VEH = [['todos', 'Todos'], ['problemas', '⚠ Por revisar'], ['Duplicado', 'Placa repetida'], ['Placa', 'Placa'], ['Propietario', 'Propietario'],
  ['Celular', 'Celular'], ['Empresa', 'Empresa'], ['archivados', '🗄 Archivados']];
function vistaVehiculos(f) {
  const L = VEHS || [], busca = v => !f || JSON.stringify([v.placa, v.empresa, v.propietario, v.celularPropietario, v.conductores]).toLowerCase().includes(f);
  const lista = L.map((v, i) => Object.assign({ i }, v)).filter(v => pasaFiltroCond(v, condFiltro) && busca(v))
    .sort((a, b) => (b.problemas.length > 0) - (a.problemas.length > 0) || String(a.placa).localeCompare(String(b.placa)));
  const n = k => L.filter(v => pasaFiltroCond(v, k)).length;
  const chip = p => `<span class="pr pr-${esc(p.tipo)}" title="${esc(p.msg)}">${esc(p.tipo + ': ' + p.msg)}</span>`;
  return `<div class="filtros">${FILTROS_VEH.map(([k, t]) => `<button class="b b-mini ${condFiltro === k ? 'on' : ''}" onclick="condFiltro='${k}';pintar()">${t} <span class="num">${n(k)}</span></button>`).join('')}
      <span class="sub" style="margin-left:auto">Registro leído ${esc(hace(new Date(condHora).toISOString()))}</span>
      <button class="b b-mini" onclick="cargarConductores(true)">🔄 Recargar</button></div>
    <p class="sub" style="margin:0 0 10px">Para asignar un vehículo a un viaje debe tener propietario y su celular. Busque arriba por placa, propietario, celular o conductor. Cada cambio muestra primero qué se va a cambiar y solo se guarda al confirmar; nada se borra.</p>
    ${!lista.length ? '<div class="vacio">Ningún vehículo con ese filtro.</div>' : `<div class="tabla"><table class="conds"><thead><tr><th>Placa</th><th>Empresa</th><th>Propietario</th><th>Celular propietario</th><th>Conductores</th><th>Viajes</th><th>Estado</th><th>Por revisar</th><th></th></tr></thead><tbody>
    ${lista.map(v => `<tr class="${archivadoC(v) ? 'arch' : ''}"><td><span class="placa">${esc(v.placa)}</span></td><td>${esc(v.empresa || '—')}</td>
      <td>${esc(v.propietario || '—')}</td><td>${esc(v.celularPropietario || '—')}</td><td class="sub">${esc(v.conductores || '—')}</td>
      <td>${v.viajes || 0}${v.ultimoViaje ? `<div class="sub">último ${esc(diaTxt(v.ultimoViaje))}</div>` : ''}</td>
      <td><span class="sub">${esc(v.estado || '')}</span>${v.falta && !archivadoC(v) ? `<div class="sub tarde">falta: ${esc(v.falta)}</div>` : ''}</td>
      <td class="prs">${v.problemas.map(chip).join('') || (archivadoC(v) ? '' : '<span class="si">✓</span>')}</td>
      <td style="white-space:nowrap">${archivadoC(v) ? `<button class="b b-mini" onclick="restaurarVeh(${v.i})">↩ Restaurar</button>` :
        `<button class="b b-mini" onclick="editarVeh(${v.i})">✏️ Editar</button> <button class="b b-mini" onclick="archivarVeh(${v.i})">🗄 Archivar</button>`}</td></tr>`).join('')}
    </tbody></table></div>`}`;
}
function editarVeh(i) {
  const v = VEHS[i], est = /^bloquead/i.test(v.estado) ? 'Bloqueado' : /^inactiv/i.test(v.estado) ? 'Inactivo' : '';
  ventana(`<h2>✏️ Editar vehículo <span class="placa">${esc(v.placa)}</span></h2>${problemasHtml(v)}
    <form class="form" id="fveh" onsubmit="event.preventDefault();previaVeh(${i})">
      <label>Placa<input name="placa" value="${esc(v.placa)}" required></label>
      <label>Empresa<input name="empresa" value="${esc(v.empresa)}" placeholder="ENTRAPETROL o la del tercero"></label>
      <label class="full">Propietario (nombre o empresa dueña)<input name="propietario" value="${esc(v.propietario)}"></label>
      <label>Celular del propietario<input name="celularPropietario" value="${esc(v.celularPropietario)}" inputmode="tel"></label>
      <label>Estado<select name="estado">${[['', 'Automático (Completo / Por completar)'], ['Bloqueado', 'Bloqueado'], ['Inactivo', 'Inactivo']].map(([x, t]) =>
        `<option value="${x}" ${est === x ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="full">Conductores que lo han manejado (separados por /)<input name="conductores" value="${esc(v.conductores)}"></label>
      <div class="full sub">Si corrige la placa, corríjala también en los viajes que la tienen mal: el mantenimiento de cada hora vuelve a agregar las placas de los viajes.</div>
    </form>
    <div class="pie"><button class="b" onclick="arreglarFormatoVeh()" title="Solo corrige el formato de lo escrito: mayúsculas, espacios, guiones de la placa">🧹 Arreglar formato</button>
      <button class="b" onclick="cerrarVentana()">Cancelar</button><button class="b b-pri" form="fveh">Ver cambios</button></div>`, true);
}
function arreglarFormatoVeh() {
  const f = $('#fveh'); if (!f) return;
  const p = f.placa.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (/^[A-Z]{3}\d{3}$/.test(p)) f.placa.value = p;
  ['empresa', 'propietario'].forEach(k => { f[k].value = f[k].value.trim().toUpperCase().replace(/\s+/g, ' '); });
  const cel = f.celularPropietario.value.replace(/\D/g, '').replace(/^57(?=\d{10}$)/, ''); if (cel.length === 10) f.celularPropietario.value = cel;
  toast('Formato corregido en el formulario: revise y pulse Ver cambios');
}
function previaVeh(i) {
  const f = $('#fveh'), v = VEHS[i];
  previa({ action: 'vehiculos', op: 'editar', antes: v.fila, nuevo: { placa: f.placa.value, empresa: f.empresa.value, propietario: f.propietario.value,
    celularPropietario: f.celularPropietario.value, conductores: f.conductores.value, estado: f.estado.value } }, '✏️ Editar ' + v.placa, () => editarVeh(i));
}
function archivarVeh(i) {
  const v = VEHS[i];
  ventana(`<h2>🗄 Archivar vehículo <span class="placa">${esc(v.placa)}</span></h2>
    <p class="sub">${esc(v.propietario || 'Sin propietario')} · ${v.viajes || 0} viajes. No se borra: queda en la hoja con Estado "Archivado", no se puede asignar y se puede restaurar.</p>
    <form class="form" id="farchv" onsubmit="event.preventDefault();previa({action:'vehiculos',op:'archivar',antes:VEHS[${i}].fila,motivo:this.motivo.value},'🗄 Archivar ${esc(v.placa)}',()=>archivarVeh(${i}))">
      <label class="full">Motivo<input name="motivo" required minlength="4" placeholder="Ej.: placa mal escrita repetida, vehículo vendido"></label></form>
    <div class="pie"><button class="b" onclick="cerrarVentana()">Cancelar</button><button class="b b-pri" form="farchv">Ver cambios</button></div>`, true);
}
function restaurarVeh(i) { previa({ action: 'vehiculos', op: 'restaurar', antes: VEHS[i].fila }, '↩ Restaurar ' + VEHS[i].placa, () => cerrarVentana()); }
// paso 1: el servidor dice qué cambiaría (sin escribir); paso 2: la persona confirma y se guarda
async function previa(body, titulo, volver) {
  ventana(`<h2>${esc(titulo)}</h2><div class="vacio">Calculando los cambios…</div>`, true);
  let r;
  try { r = await postear(Object.assign({ action: 'conductores', vista: true }, body)); } catch (e) { r = { ok: false, error: e.message }; }
  if (r.ok && r.elegir) return elegirFusion(CONDS.findIndex(c => c.fila === body.queda), r);
  CONDS_VOLVER = volver;
  if (!r.ok) return ventana(`<h2>${esc(titulo)}</h2><div class="nov">✖ ${esc(r.error)}</div>
    <div class="pie"><button class="b" onclick="CONDS_VOLVER()">Volver</button>${/cambió en la hoja/.test(r.error) ? '<button class="b b-pri" onclick="cerrarVentana();cargarConductores(true)">🔄 Recargar la lista</button>' : ''}</div>`, true);
  condPend = body;
  ventana(`<h2>${esc(titulo)}</h2><p class="sub">Esto es lo que se va a cambiar en el registro. Revise y confirme.</p>
    <div class="tabla"><table><thead><tr><th>Conductor / placa</th><th>Campo</th><th>Antes</th><th>Después</th></tr></thead><tbody>
    ${r.cambios.map(c => `<tr><td>${esc(c.conductor)}</td><td><b>${esc(c.campo)}</b></td><td class="antes">${esc(c.antes) || '<span class="sub">vacío</span>'}</td><td class="despues">${esc(c.despues) || `<span class="sub">${c.campo === 'Estado' ? 'automático (Completo / Por completar)' : 'vacío'}</span>`}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="sub">Lo de "Antes" queda guardado en la pestaña Historial registro con su nombre (${esc(USUARIO)}) y la fecha.</p>
    <div class="pie"><button class="b" onclick="CONDS_VOLVER()">Volver</button><button class="b b-pri" id="bconf" onclick="confirmarCond()">✔ Confirmar y guardar</button></div>`, true);
}
let CONDS_VOLVER = () => cerrarVentana();
async function confirmarCond() {
  const b = $('#bconf'); if (!condPend) return; if (b) { b.disabled = true; b.textContent = 'Guardando…'; }
  let r;
  try { r = await postear(Object.assign({ action: 'conductores' }, condPend)); } catch (e) { r = { ok: false, error: e.message }; }
  if (!r.ok) { if (b) { b.disabled = false; b.textContent = '✔ Confirmar y guardar'; } return toast('✖ No se guardó: ' + r.error); }
  condPend = null; FUS_ELEGIR = {};
  CONDS = r.conductores || CONDS; VEHS = r.vehiculos || VEHS; condHora = Date.now();
  if (r.registro) REGISTRO = r.registro;   // la orden de cargue usa la cédula del registro
  cerrarVentana(); pintar(); toast('✔ Guardado: ' + r.cambios.length + ' cambio(s) en el registro');
}

/* ---------- utilidades ---------- */
// fijo = la ventana no se cierra al hacer clic afuera (formularios largos: no perder lo escrito)
function ventana(html, fijo) {
  cerrarVentana();
  const v = document.createElement('div'); v.className = 'velo'; v.id = 'velo';
  v.innerHTML = `<div class="ven">${html}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v && !fijo) cerrarVentana(); });
  document.body.appendChild(v);
}
function cerrarVentana() { const v = $('#velo'); if (v) v.remove(); }
function copiar(t) { navigator.clipboard.writeText(t).then(() => toast('Copiado')); }
let tt;
function toast(m) { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.style.display = ''; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3000); }

cargar();
setInterval(() => { if (!document.hidden && !$('#velo') && document.activeElement.type !== 'search') cargar(true); }, 60000);
setInterval(() => { if (sinConexion && !document.hidden) cargar(true); }, 20000);   // sin conexión: reintenta más seguido
</script>
</body>
