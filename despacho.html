<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Despacho Conductores</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f1f3f6; --line:#e3e6eb; --text:#1b1f27; --muted:#667085;
  --accent:#ff007f; --accent-soft:#ffe9f3; --ok:#16a34a; --ok-soft:#dcfce7; --warn:#c2410c; --warn-soft:#ffedd5; --bad:#dc2626; --bad-soft:#fee2e2;
  --wa:#25d366;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:3}
header h1{font-size:17px;margin:0}
header h1 b{color:var(--accent)}
header .hora{color:var(--muted);font-size:12px}
header .der{margin-left:auto;display:flex;gap:8px}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b:hover{background:var(--surface-2)}
.b-pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b-pri:hover{background:#e6006f}
.b-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.b-wa:hover{background:#1ebe5b}
.b-mini{padding:4px 9px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .num{background:var(--surface-2);border-radius:99px;padding:0 7px;margin-left:4px;font-size:12px}
.alerta{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.alerta h3{margin:0 0 6px;font-size:14px;color:var(--bad)}
.alerta .it{display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;gap:8px;align-items:flex-start}
.op{font-size:11px;font-weight:800;border-radius:5px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.op.IMPO{background:#e0ecff;color:#1d4ed8}
.card .bk{font-weight:800;font-size:15px}
.card .sub{color:var(--muted);font-size:13px}
.placa{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.barra{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok)}
.estado{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.estado b{color:var(--ok)}
.tarde{color:var(--warn);font-weight:700}
.nov{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 8px;font-size:13px}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);background:var(--surface-2);font-weight:700}
.tabla{overflow-x:auto}
.vacio{color:var(--muted);text-align:center;padding:40px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:240px}
/* ventanas */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.ven{background:var(--surface);border-radius:14px;width:min(640px,100%);padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ven h2{margin:0 0 12px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form .full{grid-column:1/-1}
.form>*{min-width:0}
.form select{width:100%;max-width:100%}
.ccveh{flex-direction:row!important;align-items:flex-start!important}
.ccgrupo{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:400;font-size:14px}
.form textarea{min-height:80px}
.pie{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.archivos{display:flex;flex-direction:column;gap:4px;font-weight:400;color:var(--text)}
.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:13px;border:1px solid var(--line)}
.linea{list-style:none;margin:0;padding:0}
.linea li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.linea .h{color:var(--muted);font-size:12px}
.linea .t-novedad{color:var(--bad);font-weight:700}
.linea img{max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
.login{display:grid;place-items:center;min-height:80vh}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(360px,92vw)}
.login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--surface)}
.ident{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ident .por{color:var(--warn);font-weight:700}
.ident .si{color:var(--ok);font-weight:700}
.ident .no{color:var(--bad);font-weight:700}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comparar figure{margin:0;background:var(--surface-2);border-radius:10px;padding:8px;text-align:center}
.comparar img{width:100%;height:320px;object-fit:contain;border-radius:8px;background:#000;cursor:zoom-in}
.comparar figcaption{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
@media (max-width:600px){.form{grid-template-columns:1fr} header .der{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.API_URL || 'https://script.google.com/macros/s/AKfycbz_st7NWwfY57QfMyTBLGxnufoIMgvlh3wKIwgi2PuzcrT409dFKI7iPsz3hOhUFKQ0/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
const qs = new URLSearchParams(location.search);
let CLAVE = qs.get('clave') || ls.get('despacho_clave') || '';
let USUARIO = ls.get('despacho_usuario') || '';
let D = null, pestana = ls.get('despacho_tab') || 'curso', filtro = '';
const fotos = {};

async function pedir(params) {
  const r = await fetch(API + '?' + new URLSearchParams(Object.assign({ vista: 'despacho', formato: 'json', clave: CLAVE }, params)));
  return r.json();
}
async function postear(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ clave: CLAVE, usuario: USUARIO }, body)) });
  return r.json();
}

function login(error) {
  $('#app').innerHTML = `<div class="login"><form onsubmit="entrar(event)"><h2 style="margin:0">Despacho de conductores</h2>
    <p style="color:var(--muted);margin:4px 0 0">Entrapetrol · Reckitt</p>
    <input name="usuario" placeholder="Su nombre" value="${esc(USUARIO)}" required>
    <input name="clave" type="password" placeholder="Clave del equipo" value="${esc(CLAVE)}" required>
    ${error ? '<div style="color:var(--bad)">Clave incorrecta</div>' : ''}
    <button class="b b-pri" style="width:100%;justify-content:center">Entrar</button></form></div>`;
}
function entrar(e) {
  e.preventDefault();
  const f = e.target;
  CLAVE = f.clave.value.trim(); USUARIO = f.usuario.value.trim();
  ls.set('despacho_usuario', USUARIO);
  cargar();
}

async function cargar(silencioso) {
  if (!CLAVE) return login();
  if (!D && !silencioso) $('#app').innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    const d = await pedir({});
    if (!d.ok) { if (d.error === 'clave') { CLAVE = ''; ls.set('despacho_clave', ''); return login(true); } throw new Error(d.error); }
    ls.set('despacho_clave', CLAVE);
    if (!USUARIO) return login();   // falta el nombre: se pide en el formulario (prompt() no funciona en todos los navegadores)
    D = d; D.turnos = turnosHora ? TURNOS : null; pintar();
    cargarTurnos();
  } catch (e) { if (!silencioso) toast('No se pudo cargar: ' + e.message); }
}
// conductores enturnados y disponibles en la app Viajes ETP (turnos.html): vienen con los datos del tablero
// (turnosConductores, Conductores.gs resumenTurnos_: últimos 10 días, sin los retirados); se piden aparte para no demorar Despacho
let TURNOS = [], turnosHora = 0, DESTINOS = {}, VIAJES = [];   // DESTINOS: id del viaje -> país o bodega (Despacho no los trae)
async function cargarTurnos(forzar) {
  if (!forzar && Date.now() - turnosHora < 5 * 60e3) return;
  try {
    const j = await (await fetch(API + '?' + new URLSearchParams({ formato: 'json', clave: CLAVE }))).json();
    if (!j.ok) return;
    TURNOS = j.turnosConductores || []; turnosHora = Date.now();
    VIAJES = j.viajes || [];   // también para 📧 Orden de cargue (destino, motonave, puerto, fechas)
    VIAJES.forEach(v => { DESTINOS[v.id] = v.operacion === 'EXPO' ? v.pais : (v.bodega || v.destino); });
    if (D) { D.turnos = TURNOS; if (!$('#velo')) pintar(); }
  } catch (e) { /* sin turnos: Despacho sigue igual */ }
}
const enturnadosDe = v => (D.turnos || []).filter(t => t.tipo === 'Turno' && t.viajeId === v.id);

/* ---------- cálculo ---------- */
const activa = a => a.estado === 'Activa';
function eventosDe(token) { return D.eventos.filter(e => e.token === token).sort((x, y) => new Date(x.fechaCliente || x.fecha) - new Date(y.fechaCliente || y.fecha)); }
function novedadesRecientes() {
  const lim = Date.now() - 24 * 3600e3;
  return D.eventos.filter(e => e.tipo === 'novedad' && new Date(e.fecha) > lim).sort((x, y) => new Date(y.fecha) - new Date(x.fecha));
}
function asignacionDe(v) {
  return D.asignaciones.find(a => a.estado !== 'Anulada' && (a.viajeId === v.id || (String(a.booking) === String(v.booking) && a.placa === v.placa && v.placa)));
}
function hace(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min';
  const h = Math.floor(m / 60); if (h < 24) return 'hace ' + h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
  return 'hace ' + Math.floor(h / 24) + ' d';
}
function fh(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}
function citaTxt(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d) || !/T\d/.test(s)) return s;
  return d.toLocaleString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
}

/* ---------- pantalla ---------- */
function pintar() {
  const curso = D.asignaciones.filter(activa);
  const term = D.asignaciones.filter(a => !activa(a));
  const libres = D.viajes.filter(v => !asignacionDe(v));
  const nEnt = (D.turnos || []).filter(t => t.tipo === 'Turno').length, nDisp = (D.turnos || []).filter(t => t.tipo === 'Disponible').length;
  const nov = novedadesRecientes();
  const porRevisar = D.asignaciones.filter(a => a.verificacion && a.verificacion.estado === 'Por revisar' && a.estado !== 'Anulada');
  const f = filtro.toLowerCase();
  const pasa = o => !f || JSON.stringify([o.booking, o.placa, o.conductor, o.operacion, o.contenedor]).toLowerCase().includes(f);
  ls.set('despacho_tab', pestana);

  $('#app').innerHTML = `
  <header>
    <h1>🚛 Despacho de conductores · <b>Reckitt</b></h1>
    <span class="hora">datos de ${esc(D.hora)} · ${esc(USUARIO)}</span>
    <div class="der">
      <input type="search" placeholder="Buscar booking, placa, conductor" value="${esc(filtro)}" oninput="filtro=this.value;pintar();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
      <button class="b" onclick="cargar();cargarTurnos(true)">🔄</button>
      <button class="b" onclick="confirmarCargue()" title="Orden de cargue por correo (contenedor vacío, llenado en planta o retiro en puerto): placa, conductor, fecha y hora, lugar y la imagen de la orden">📧 Orden de cargue</button>
      <button class="b b-pri" onclick="formulario()">+ Nueva asignación</button>
    </div>
  </header>
  <main>
    ${nov.length ? `<div class="alerta"><h3>⚠️ Novedades de conductores (últimas 24 h)</h3>${nov.slice(0, 6).map(e => {
      const a = D.asignaciones.find(x => x.token === e.token) || {};
      return `<div class="it"><b>${esc(e.pasoTexto)}</b> · ${esc(e.conductor || '')} <span class="placa">${esc(e.placa)}</span> · ${esc(e.booking)}
        ${e.texto ? `· “${esc(e.texto)}”` : ''} <span class="hora">${hace(e.fecha)}</span>
        ${e.lat ? `<a class="b b-mini" target="_blank" href="https://maps.google.com/?q=${e.lat},${e.lng}">📍 Mapa</a>` : ''}
        ${a.telefono ? `<a class="b b-mini b-wa" target="_blank" href="https://wa.me/${a.telefono}">💬</a>` : ''}
        <button class="b b-mini" onclick="detalle('${e.token}')">Ver</button></div>`;
    }).join('')}</div>` : ''}
    ${porRevisar.length ? `<div class="alerta" style="background:var(--warn-soft);border-color:var(--warn)"><h3 style="color:var(--warn)">🪪 Identidades por revisar</h3>${porRevisar.map(a =>
      `<div class="it"><b>${esc(a.conductor || 'Conductor')}</b> <span class="placa">${esc(a.placa)}</span> · ${esc(a.booking)} <span class="hora">${hace(a.verificacion.fecha)}</span>
        <button class="b b-mini" onclick="revisar('${a.token}')">Comparar fotos</button></div>`).join('')}</div>` : ''}
    <div class="tabs">
      <button class="${pestana === 'curso' ? 'on' : ''}" onclick="pestana='curso';pintar()">En curso<span class="num">${curso.length}</span></button>
      <button class="${pestana === 'libres' ? 'on' : ''}" onclick="pestana='libres';pintar()">Viajes sin asignar<span class="num">${libres.length}</span></button>
      <button class="${pestana === 'term' ? 'on' : ''}" onclick="pestana='term';pintar()">Terminadas / anuladas<span class="num">${term.length}</span></button>
      <button class="${pestana === 'turnos' ? 'on' : ''}" onclick="pestana='turnos';pintar()">🙋 Enturnados<span class="num">${nEnt}</span>${nDisp ? `<span class="num" title="Disponibles">🟢 ${nDisp}</span>` : ''}</button>
    </div>
    ${pestana === 'curso' ? tarjetas(curso.filter(pasa)) : pestana === 'term' ? tarjetas(term.filter(pasa).reverse()) : pestana === 'turnos' ? vistaTurnos(f) : tablaLibres(libres.filter(pasa))}
  </main>`;
}

function tarjetas(lista) {
  if (!lista.length) return '<div class="vacio">No hay asignaciones aquí. Use “+ Nueva asignación” o la pestaña “Viajes sin asignar”.</div>';
  return `<div class="grid">${lista.map(a => {
    const n = a.hechos.length, t = a.pasos.length, ult = a.hechos[n - 1];
    const sig = a.pasos[n];
    const evs = eventosDe(a.token);
    const ultNov = evs.filter(e => e.tipo === 'novedad').pop();
    const quieto = activa(a) && n > 0 && n < t && (Date.now() - new Date(ult.fecha)) > 6 * 3600e3;
    const sinAbrir = activa(a) && n === 0;
    return `<div class="card">
      <div class="top"><span class="op ${a.operacion}">${a.operacion}</span>
        <div><div class="bk">Booking ${esc(a.booking)}</div>
        <div class="sub"><span class="placa">${esc(a.placa || 'sin placa')}</span> · ${esc(a.conductor || 'sin conductor')}${a.contenedor ? ' · ' + esc(a.contenedor) : ''}</div></div>
        ${a.estado !== 'Activa' ? `<span class="op" style="margin-left:auto">${esc(a.estado)}</span>` : ''}</div>
      ${a.cita ? `<div class="sub">📅 ${esc(citaTxt(a.cita))}${a.lugarCita ? ' · ' + esc(a.lugarCita) : ''}</div>` : ''}
      <div class="barra"><i style="width:${Math.round(100 * n / t)}%"></i></div>
      <div class="estado"><span>${n ? `<b>${esc(a.pasos[n - 1].corto)}</b> · <span class="${quieto ? 'tarde' : ''}">${hace(ult.fecha)}</span>` : (sinAbrir ? '<span class="tarde">Aún no marca ningún paso</span>' : '')}</span><span>${n}/${t}</span></div>
      ${sig && activa(a) ? `<div class="sub">Sigue: ${sig.icono} ${esc(sig.texto)}</div>` : ''}
      ${identidadHtml(a)}
      ${ultNov ? `<div class="nov">⚠️ ${esc(ultNov.pasoTexto)}${ultNov.texto ? ': ' + esc(ultNov.texto) : ''} · ${hace(ultNov.fecha)}</div>` : ''}
      <div class="acc">
        <button class="b b-mini b-wa" onclick="whatsapp('${a.token}')">💬 WhatsApp</button>
        <button class="b b-mini" onclick="formulario('${a.token}')">✏️ Cita / archivos</button>
        <button class="b b-mini" onclick="detalle('${a.token}')">📋 Detalle</button>
        ${activa(a) && a.booking ? `<button class="b b-mini" onclick='confirmarCargue(${esc(JSON.stringify(String(a.booking)))})'>📧 Orden de cargue</button>` : ''}
        ${activa(a) ? `<button class="b b-mini" onclick="cerrar('${a.token}','terminar')">✔ Terminar</button>
          <button class="b b-mini" onclick="cerrar('${a.token}','anular')">⛔ Anular</button>` : ''}
      </div></div>`;
  }).join('')}</div>`;
}

function tablaLibres(lista) {
  if (!lista.length) return '<div class="vacio">Todos los viajes abiertos de la hoja ya tienen conductor asignado en la app.</div>';
  return `<div class="tabla"><table><thead><tr><th>Op.</th><th>Booking</th><th>Placa</th><th>Conductor</th><th>Retiro</th><th>Llenado</th><th>Patio / Puerto</th><th>Status</th><th>🙋 Enturnados</th><th></th></tr></thead><tbody>
    ${lista.map(v => `<tr><td><span class="op ${v.operacion}">${esc(v.operacion)}</span></td><td><b>${esc(v.booking)}</b></td>
      <td><span class="placa">${esc(v.placa || '—')}</span></td><td>${esc(v.conductor || '—')}</td><td>${esc(v.fechaRetiro)}</td><td>${esc(v.fechaCargue)}</td>
      <td>${esc([v.patio, v.puerto].filter(Boolean).join(' / '))}</td><td>${esc(v.situacion)}</td>
      <td>${enturnadosDe(v).map(t => botonTurno(v, t)).join(' ') || '<span class="sub">—</span>'}</td>
      <td><button class="b b-mini b-pri" onclick="formulario(null,'${esc(v.id)}')">Asignar</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- enturnados y disponibles (app Viajes ETP) ---------- */
const nombreViaje = v => `${v.operacion} ${DESTINOS[v.id] || (v.operacion === 'EXPO' ? v.pais : v.bodega || v.destino) || ''}`.trim();
const primerDia = v => v.fechaRetiro || v.fechaCargue || '';
const diaTxt = iso => iso ? new Date(iso.slice(0, 10) + 'T12:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }) : 'sin fecha';
const celTurno = t => String(t.telefono || '').replace(/^57(?=\d{10}$)/, '');
function botonTurno(v, t) {
  return `<button class="b b-mini b-pri" onclick='asignarTurno(${JSON.stringify(v.id)}, ${JSON.stringify({ placa: t.placa, conductor: t.conductor, telefono: celTurno(t) })})'
    title="Se enturnó ${esc(hace(t.creado))} · cel ${esc(celTurno(t))}">🙋 ${esc(t.placa)} · ${esc(String(t.conductor).split(' ').slice(0, 2).join(' '))}</button>`;
}
function asignarTurno(viajeId, pre) { formulario(null, viajeId, pre); }
function vistaTurnos(f) {
  if (!D.turnos) return '<div class="vacio">Cargando los turnos de la app…</div>';
  const pasaT = t => !f || JSON.stringify([t.placa, t.conductor, t.viajeId, t.ciudad]).toLowerCase().includes(f);
  const turnos = D.turnos.filter(t => t.tipo === 'Turno' && pasaT(t)), disp = D.turnos.filter(t => t.tipo === 'Disponible' && pasaT(t));
  const viajeDe = id => D.viajes.find(v => v.id === id);
  const ids = [...new Set(turnos.map(t => t.viajeId))].sort((a, b) => String(primerDia(viajeDe(a) || {}) || '9').localeCompare(String(primerDia(viajeDe(b) || {}) || '9')));
  const wa = (t, txt) => t.telefono ? `<a class="b b-mini b-wa" target="_blank" href="https://wa.me/${String(t.telefono).replace(/\D/g, '')}?text=${encodeURIComponent(txt)}">💬</a>` : '';
  const porViaje = ids.length ? `<div class="grid">${ids.map(id => {
    const v = viajeDe(id), L = turnos.filter(t => t.viajeId === id).sort((a, b) => String(a.creado).localeCompare(String(b.creado)));
    const asig = v && asignacionDe(v);
    return `<div class="card"><div class="top"><span class="op ${v ? v.operacion : ''}">${esc(v ? v.operacion : '')}</span>
        <div><div class="bk">${esc(id)} · ${esc(v ? nombreViaje(v) : 'viaje cerrado o no encontrado')}</div>
        <div class="sub">${v ? `${v.booking ? 'Booking ' + esc(v.booking) + ' · ' : ''}<b>${esc(diaTxt(primerDia(v)))}</b> · ${asig ? `asignado a <span class="placa">${esc(asig.placa || '')}</span>` : v.placa ? `vehículo <span class="placa">${esc(v.placa)}</span>` : '<span class="tarde">sin vehículo</span>'}` : ''}</div></div></div>
      ${L.map((t, i) => `<div class="estado" style="align-items:center"><span>${i + 1}.º <span class="placa">${esc(t.placa)}</span> ${esc(t.conductor)} <span class="sub">· ${esc(celTurno(t))} · ${esc(hace(t.creado))}</span></span>
        <span style="display:flex;gap:4px">${v && !asig && !v.placa ? botonTurno(v, t) : ''}${wa(t, `Hola ${String(t.conductor).split(' ')[0]}, sobre el viaje ${v ? nombreViaje(v) + ' del ' + diaTxt(primerDia(v)) : id} al que se enturnó: `)}</span></div>`).join('')}
    </div>`;
  }).join('')}</div>` : '<div class="vacio">Ningún conductor se ha enturnado en los últimos 10 días.</div>';
  const libres = D.viajes.filter(v => !asignacionDe(v) && !v.placa && primerDia(v)).sort((a, b) => primerDia(a).localeCompare(primerDia(b)));
  const disponibles = disp.length ? `<div class="tabla"><table><thead><tr><th>Vehículo y conductor</th><th>Disponible</th><th>Asignar a un viaje sin vehículo</th><th></th></tr></thead><tbody>
    ${disp.map(t => { const ops = libres.filter(v => !t.desde || primerDia(v) >= t.desde);
      return `<tr><td><span class="placa">${esc(t.placa)}</span> ${esc(t.conductor)}<div class="sub">${esc(celTurno(t))}</div></td>
        <td>${t.desde ? 'desde ' + esc(diaTxt(t.desde)) : 'ya'}${t.ciudad ? ' · ' + esc(t.ciudad) : ''}<div class="sub">avisó ${esc(hace(t.creado))}</div></td>
        <td>${ops.length ? `<select onchange='if(this.value) asignarTurno(this.value, ${JSON.stringify({ placa: t.placa, conductor: t.conductor, telefono: celTurno(t) })})'><option value="">Elegir viaje…</option>
          ${ops.map(v => `<option value="${esc(v.id)}">${esc(diaTxt(primerDia(v)))} · ${esc(v.id)} · ${esc(nombreViaje(v))}</option>`).join('')}</select>` : '<span class="sub">No hay viajes sin vehículo desde esa fecha</span>'}</td>
        <td>${wa(t, `Hola ${String(t.conductor).split(' ')[0]}, vimos que está disponible${t.desde ? ' desde el ' + diaTxt(t.desde) : ''}: `)}</td></tr>`; }).join('')}
  </tbody></table></div>` : '<div class="vacio">Nadie ha reportado estar disponible en los últimos 10 días.</div>';
  return `<p class="sub" style="margin:0 0 10px">Lo que los conductores marcaron en la app Viajes ETP (últimos 10 días, sin los que se retiraron). 🙋 abre la asignación con el vehículo, el conductor y su celular ya puestos.</p>
    <h3 style="margin:0 0 8px">🙋 Enturnados por viaje</h3>${porViaje}
    <h3 style="margin:18px 0 8px">🟢 Disponibles</h3>${disponibles}`;
}

  const n = s => String(s || '').trim().toLowerCase();
  const d = D.directorio.find(x => conductor && n(x.conductor) === n(conductor)) || D.directorio.find(x => placa && n(x.placa) === n(placa));
  return d ? d.telefono : '';
}

function autoTel() {
  const f = $('#fa');
  if (!f.telefono.value) f.telefono.value = telDe(f.conductor.value, f.placa.value);
}
function leerArchivo(file) {
  return new Promise((ok, mal) => {
    if (/^image\//.test(file.type) && file.size > 600e3) {   // fotos grandes: se reducen para que carguen rápido en el celular
      const img = new Image();
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ nombre: file.name.replace(/\.\w+$/, '') + '.jpg', tipo: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.8) }); };
      img.onerror = mal; img.src = URL.createObjectURL(file); return;
    }
    const r = new FileReader(); r.onload = () => ok({ nombre: file.name, tipo: file.type, base64: r.result }); r.onerror = mal; r.readAsDataURL(file);
  });
}
async function guardarAsig(e, token) {
  e.preventDefault();
  const f = e.target, b = $('#bguardar');
  b.disabled = true; b.textContent = 'Guardando…';
  try {
    const datos = { action: 'asignar', token: token || undefined };
    ['operacion', 'booking', 'placa', 'conductor', 'telefono', 'contenedor', 'cita', 'lugarCita', 'instrucciones', 'viajeId'].forEach(k => datos[k] = f[k].value);
    datos.archivosNuevos = await Promise.all([...f.archivos.files].map(leerArchivo));
    datos.quitarArchivos = [...f.querySelectorAll('[name=quitar]:checked')].map(x => x.value);
    const r = await postear(datos);
    if (!r.ok) throw new Error(r.error);
    await cargar(true);
    whatsapp(r.token, !r.nueva);
  } catch (err) { b.disabled = false; b.textContent = 'Reintentar'; toast('Error: ' + err.message); }
}

const enlaceApp = a => a.enlaceApp;

function whatsapp(token, actualizacion) {
  const a = D.asignaciones.find(x => x.token === token);

  const txt = mensaje(a, actualizacion);
  const wa = 'https://wa.me/' + (a.telefono || '') + '?text=' + encodeURIComponent(txt);
  ventana(`<h2>💬 Enviar por WhatsApp</h2>

async function cerrar(token, accion) {
  const a = D.asignaciones.find(x => x.token === token);
  if (!confirm(`${accion === 'anular' ? '¿Anular' : '¿Dar por terminada'} la asignación del booking ${a.booking} (${a.placa})?${accion === 'anular' ? '\nEl enlace del conductor dejará de funcionar.' : ''}`)) return;
  const r = await postear({ action: accion, token });
  if (!r.ok) return toast('Error: ' + r.error);
  toast(accion === 'anular' ? 'Anulada' : 'Terminada'); cargar(true);
}

async function decidir(token, aprobado) {
  const r = await postear({ action: 'revisarIdentidad', token, aprobado });
  if (!r.ok) return toast('Error: ' + r.error);
  cerrarVentana(); toast(aprobado ? 'Identidad aprobada' : 'Rechazada: el conductor deberá repetirla');
  if (!aprobado) { const a = D.asignaciones.find(x => x.token === token); if (a.telefono) window.open('https://wa.me/' + a.telefono + '?text=' + encodeURIComponent('Hola, no pudimos confirmar su identidad. Por favor abra de nuevo el enlace del viaje, acéptelo otra vez y tómese la selfie y la foto de la cédula con buena luz: ' + enlaceApp(a))); }
  cargar(true);
}
function cargarFotos() {
  document.querySelectorAll('[data-foto]').forEach(async img => {
    const id = img.dataset.foto;
    try {
      if (!fotos[id]) { const d = await pedir({ archivo: id }); if (d.ok) fotos[id] = 'data:' + d.tipo + ';base64,' + d.base64; }
      img.src = fotos[id];
    } catch (e) { }
  });
}

// Correo al cliente: se elige el booking (abierto, con vehículo), los vehículos que van, la hora de llegada, el lugar de cargue, un
// comentario, la orden de cargue (imagen: se ve dentro del correo y va adjunta) y la firma; Para y CC con casillas de la lista de
// destinatarios (Código.gs DESTINATARIOS_RESUMEN) y hasta 3 correos a mano en CC. Lo arma y envía Cliente.gs confirmarCargue_.
// "Ver correo" lo muestra antes; "Enviar prueba" va solo a calidad+prueba@. La firma y el último Para/CC se recuerdan en este equipo.

  const L = VIAJES.filter(v => v.booking && v.placa && !v.padre && (v.situacion || 'Abierto') === 'Abierto' && !/^(sin info|pend)/i.test(v.booking));
  const g = {}; L.forEach(v => { (g[v.booking] = g[v.booking] || []).push(v); });
  return Object.keys(g).map(bk => ({ bk, viajes: g[bk], fecha: g[bk].map(v => v.fechaCargue || '9').sort()[0] }))
    .sort((a, b) => a.fecha.localeCompare(b.fecha));
};

      <div class="full ccgrupo">Para<div style="display:flex;flex-wrap:wrap;gap:4px 14px">${cli.map(d => casilla(d, 'para', prev.para ? prev.para.includes(d.k) : d.k === 'jhonier')).join('')}</div></div>
      <div class="full ccgrupo">CC<div style="display:flex;flex-wrap:wrap;gap:4px 14px">${CC_DATOS.destinatarios.map(d => casilla(d, 'cc', prev.cc ? prev.cc.includes(d.k) : !!d.copia)).join('')}</div>
        <input name="ccOtros" placeholder="Otro correo en copia (hasta 3, separados por coma)" value="${esc(prev.ccOtros || '')}"></div>
      <div class="full" id="ccEstado" style="font-size:13px"></div>
      <div class="pie full"><button type="button" class="b" onclick="cerrarVentana()">Cancelar</button>
        <button type="button" class="b" onclick="verCorreoCargue()">👁 Ver correo</button>
        <button type="button" class="b" onclick="enviarCargue(true)">Enviar prueba (a calidad@)</button>
        <button type="button" class="b b-pri" id="ccEnviar" onclick="enviarCargue(false)">📧 Enviar</button></div>
      <div class="full" id="ccHist" role="status" aria-live="polite" style="font-size:12.5px;text-align:right"></div>
    </form>`, true);
  pintarHistCargue();
  pintarVehiculosCargue();
  $('#velo').addEventListener('paste', e => { const f = [...(e.clipboardData || {}).files || []].find(x => /^image\//.test(x.type)); if (f) { e.preventDefault(); leerOrdenCargue(f); } });
}
// 5-nov (usuario): módulo de órdenes de cargue por etapa (Cliente.gs ORDENES_CARGUE). La FECHA no se escribe aquí: es la de cada
// vehículo en el tablero según el tipo (campos de ORDENES_CARGUE; "las fechas deberían salir de lo que se ha llenado en el tablero");
// quien envía pone la hora. El lugar se sugiere (patio o puerto del viaje; la planta, la última usada) y se puede corregir.
const DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fdAnio = f => { const d = new Date(f + 'T12:00'); return `${DIAS_C[d.getDay()]} ${d.getDate()} ${MES_C[d.getMonth()]} ${d.getFullYear()}`; };   // como el tablero, con el año
const tipoCargue = () => { const f = $('#fcc'), k = f && (f.querySelector('[name=tipo]:checked') || {}).value; return k && CC_DATOS.tipos[k] ? CC_DATOS.tipos[k] : null; };
const fechaTablero = (v, T) => String((T.campos || []).map(k => v[k]).find(x => /^\d{4}-\d{2}-\d{2}/.test(String(x || ''))) || '').slice(0, 10);
const PUERTOS = { BUN: 'Puerto de Buenaventura', CTG: 'Puerto de Cartagena', SMR: 'Puerto de Santa Marta' };
const bookingSel = () => { const f = $('#fcc'); return f && bookingsCargue().find(b => b.bk === f.booking.value); };
// el paso que sigue: IMPO retiro en puerto; EXPO vacío si el retiro es más adelante, si no llenado en planta
function tipoSugerido(x) {
  const v = x.viajes[0], hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
  if (v.operacion === 'IMPO') return 'puerto';
  // la orden se manda antes del paso: retiro mañana o después → vacío; retiro hoy o ya pasó → llenado (se puede cambiar)
  return !v.fechaRetiro || String(v.fechaRetiro).slice(0, 10) > hoy ? 'vacio' : 'llenado';
}
function aplicarTipoCargue(aMano) {
  const f = $('#fcc'), x = bookingSel(); if (!f || !x) return;
  const tipo = (f.querySelector('[name=tipo]:checked') || {}).value, T = (CC_DATOS.tipos || {})[tipo]; if (!T) return;
  $('#ccHoraLbl').textContent = T.hora; $('#ccLugarLbl').textContent = T.lugar;
  const v = x.viajes[0];
  // la fecha de cada vehículo según el tipo, tal como está en el tablero; sin fecha: hay que llenarla allá
  x.viajes.forEach(y => { const el = f.querySelector(`[data-cc-fecha="${CSS.escape(y.id)}"]`); if (!el) return; const fe = fechaTablero(y, T);
    el.innerHTML = fe ? `📅 ${esc(T.paso)}: <b>${esc(fdAnio(fe))}</b>` : `<span style="color:var(--bad)">⚠ sin fecha de ${esc(T.paso)} en el tablero: llénela allá primero</span>`; });
  // lugar: se cambia solo si estaba vacío o lo había puesto la sugerencia anterior (no se borra lo que escribió la persona)
  const lugar = tipo === 'vacio' ? (v.patio ? 'Patio ' + v.patio : '') : tipo === 'puerto' ? (PUERTOS[String(v.puerto || '').toUpperCase()] || (v.puerto ? 'Puerto de ' + v.puerto : '')) : '';   // la base trae BUN o "Cartagena"
  if (!f.lugar.value || f.lugar.dataset.auto) { f.lugar.value = lugar; f.lugar.dataset.auto = lugar ? '1' : ''; }
}
function pintarVehiculosCargue(cambio) {
  const f = $('#fcc'); if (!f) return;
  const x = bookingSel(); if (!x) return $('#ccVeh').innerHTML = '';
  const v0 = x.viajes[0];
  $('#ccVeh').innerHTML = `<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px">Vehículos (los marcados van en el correo)</div>`
    + x.viajes.map(v => `<label class="ccveh" style="display:flex;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px;font-weight:400">
      <input type="checkbox" data-cc-viaje="${esc(v.id)}" checked><span><b class="placa">${esc(v.placa)}</b> · ${esc(v.conductor || '')}${v.conductor ? '' : '<span class="tarde">sin conductor</span>'}
      <span class="sub" style="color:var(--muted)"> · ${esc(v.id)}${v.contenedor ? ' · ' + esc(v.contenedor) : ''}</span>
      <br><span data-cc-fecha="${esc(v.id)}" style="font-size:13px"></span></span></label>`).join('');
  // tipo de orden: solo los de la operación del viaje (EXPO: vacío o llenado; IMPO: retiro en puerto), con el paso que sigue marcado
  f.querySelectorAll('[name=tipo]').forEach(r => { const ok = (CC_DATOS.tipos[r.value] || {}).op === v0.operacion; r.parentElement.style.display = ok ? '' : 'none'; r.disabled = !ok; });
  const marcado = f.querySelector('[name=tipo]:checked');
  if (cambio || !marcado || marcado.disabled) { const t = f.querySelector(`[name=tipo][value="${tipoSugerido(x)}"]`); if (t) t.checked = true; }
  if (cambio) f.lugar.value = '';   // otro viaje: el lugar se vuelve a sugerir
  aplicarTipoCargue(false);
}
// la imagen se reduce a 1600 px y JPEG para que el correo no pese (una foto del celular pasa de 4 MB a ~300 KB)
function leerOrdenCargue(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('La orden de cargue debe ser una imagen (JPG o PNG)');
  const img = new Image();
  img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    CC_IMG = { tipo: 'image/jpeg', b64: url.split(',')[1] };
    $('#ccImg').innerHTML = `<div style="display:flex;gap:10px;align-items:center;margin-top:6px"><img src="${url}" style="max-width:120px;max-height:90px;border:1px solid var(--line);border-radius:6px">
      <span>${esc(file.name || 'imagen pegada')} · ${Math.round(CC_IMG.b64.length * 0.75 / 1024)} KB <button type="button" class="b b-mini" onclick="CC_IMG=null;$('#ccImg').innerHTML='';$('#fcc').orden.value=''">✕ Quitar</button></span></div>`; };
  img.onerror = () => toast('No se pudo leer la imagen (si es HEIC del iPhone, envíela como JPG o tome captura)');
  img.src = URL.createObjectURL(file);
}
function datosCargue() {
  const f = $('#fcc'), marcadas = campo => [...f.querySelectorAll(`[data-cc-${campo}]:checked`)].map(i => i.getAttribute(`data-cc-${campo}`));
  return { booking: f.booking.value, tipo: (f.querySelector('[name=tipo]:checked') || {}).value, viajes: marcadas('viaje'), hora: f.hora.value, lugar: f.lugar.value.trim(), comentario: f.comentario.value.trim(),
    firma: { nombre: f.fnombre.value.trim(), cargo: f.fcargo.value.trim() }, para: marcadas('para'), cc: marcadas('cc'), ccOtros: f.ccOtros.value.trim() };
}
const estadoCargue = (txt, color) => { const e = $('#ccEstado'); if (e) e.innerHTML = `<span style="color:${color || 'inherit'}">${txt}</span>`; };
// historial bajo los botones (como el Resumen al cliente del tablero): cada vez que se presiona Enviar queda una línea con la hora y el
// resultado (las últimas 6 de esta pestaña), para saber si salió, a quién o por qué no
let histCargue = []; try { histCargue = JSON.parse(sessionStorage.getItem('cc-hist') || '[]'); } catch (e) { }
function pintarHistCargue() {
  const h = $('#ccHist'); if (!h) return;
  const color = { ok: 'var(--ok)', mal: 'var(--bad)', va: 'var(--warn)', nada: 'var(--muted)' };
  h.innerHTML = histCargue.slice(-6).reverse().map(x => `<div style="color:${color[x.e] || ''}">${esc(x.hora)} · ${esc(x.que)} · ${esc(x.txt)}</div>`).join('');
  try { sessionStorage.setItem('cc-hist', JSON.stringify(histCargue.slice(-6))); } catch (e) { }
}
function anotarCargue(que, txt, e) {
  const x = { hora: new Date().toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit', second: '2-digit' }), que, txt, e };
  histCargue.push(x); pintarHistCargue(); return x;
}
const cambiarCargue = (x, txt, e) => { x.txt = txt; x.e = e; pintarHistCargue(); };
async function verCorreoCargue() {
  const d = datosCargue(); estadoCargue('Armando el correo…');
  try {
    const r = await postear(Object.assign({ action: 'confirmarCargue', vista: true }, d));
    if (!r.ok) return estadoCargue('✖ ' + esc(r.error), 'var(--bad)');
    estadoCargue(`Para: <b>${esc(r.para.join(', '))}</b>${r.copia.length ? ' · CC: ' + esc(r.copia.join(', ')) : ''}`);
    const w = window.open('', '_blank'); if (!w) return toast('El navegador bloqueó la ventana del correo');
    w.document.write(`<title>Vista del correo</title><body style="background:#eef0f4;padding:20px;margin:0">${r.html}${CC_IMG ? `<table width="600" cellpadding="0" cellspacing="0" style="background:#fff;font-family:Arial"><tr><td style="padding:0 26px 20px"><span style="color:#667085;font-size:12px">📎 Orden de cargue (en el correo va aquí, antes de la firma, y adjunta)</span><br><img src="data:image/jpeg;base64,${CC_IMG.b64}" width="548" style="display:block;border:1px solid #d0d5dd;margin-top:6px"></td></tr></table>` : ''}</body>`); w.document.close();
  } catch (e) { estadoCargue('✖ ' + esc(e.message), 'var(--bad)'); }
}
async function enviarCargue(prueba) {
  const d = datosCargue(), que = (prueba ? 'Prueba' : 'Envío') + ' · BK ' + d.booking;
  const x = anotarCargue(que, 'presionado', 'va');   // queda constancia de que el botón se presionó
  if (!d.viajes.length) { estadoCargue('✖ Marque al menos un vehículo', 'var(--bad)'); return cambiarCargue(x, '✖ no se envió: marque al menos un vehículo', 'mal'); }
  if (!prueba && !CC_IMG && !confirm('No adjuntó la orden de cargue. ¿Enviar sin ella?')) return cambiarCargue(x, 'cancelado', 'nada');
  if (!prueba && !confirm(`¿Enviar la confirmación del booking ${d.booking} (${d.viajes.length} vehículo${d.viajes.length === 1 ? '' : 's'})?`)) return cambiarCargue(x, 'cancelado', 'nada');
  try { ls.set('cc_cargue', JSON.stringify({ firma: d.firma, para: d.para, cc: d.cc, ccOtros: d.ccOtros })); } catch (e) { }
  const b = prueba ? null : $('#ccEnviar'); if (b) b.disabled = true;
  estadoCargue(prueba ? 'Enviando la prueba…' : 'Enviando…', 'var(--warn)'); cambiarCargue(x, 'enviando…', 'va');
  try {
    const r = await postear(Object.assign({ action: 'confirmarCargue', prueba, imagen: CC_IMG }, d));
    if (!r.ok) throw new Error(r.error);
    const ok = prueba ? `✓ prueba enviada a ${r.para.join(', ')}: revise Recibidos` : `✓ enviado a ${r.para.join(', ')}${r.copia.length ? ' · CC: ' + r.copia.join(', ') : ''}${CC_IMG ? ' · con orden de cargue' : ''}`;
    estadoCargue(esc(ok), 'var(--ok)'); cambiarCargue(x, ok, 'ok');
    toast(prueba ? 'Prueba enviada' : 'Orden de cargue enviada');
    if (!prueba) CC_DATOS = null;   // la ventana queda abierta con la constancia abajo; se cierra con Cancelar
  } catch (e) { estadoCargue('✖ No se envió: ' + esc(e.message), 'var(--bad)'); cambiarCargue(x, '✖ no se envió: ' + e.message, 'mal'); }
  finally { if (b) b.disabled = false; }
}

/* ---------- utilidades ---------- */
// fijo = la ventana no se cierra al hacer clic afuera (formularios largos: no perder lo escrito)
function ventana(html, fijo) {
  cerrarVentana();
  const v = document.createElement('div'); v.className = 'velo'; v.id = 'velo';
  v.innerHTML = `<div class="ven">${html}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v && !fijo) cerrarVentana(); });
  document.body.appendChild(v);
}
function cerrarVentana() { const v = $('#velo'); if (v) v.remove(); }
function copiar(t) { navigator.clipboard.writeText(t).then(() => toast('Copiado')); }
let tt;
function toast(m) { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.style.display = ''; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3000); }

cargar();
setInterval(() => { if (!document.hidden && !$('#velo') && document.activeElement.type !== 'search') cargar(true); }, 60000);
</script>
